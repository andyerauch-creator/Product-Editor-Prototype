<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Product Editor</title>
<style>
  /* Palette + component shapes transcribed from Cedar Studio's own light
     workbench skin (apps/editor/app/globals.css, the .studio[data-wb-theme=
     "light"] block) so this prototype's chrome matches the real app rather
     than approximating a screenshot. */
  :root {
    --gutter: #f1f5f9;      /* app-bg: outermost slate-100 backdrop        */
    --bg: #ffffff;          /* canvas + thumbnail ground (wb-canvas)       */
    --panel: #ffffff;       /* panels + rail (wb-panel)                    */
    --panel-2: #f8fafc;     /* inset control / idle tool face (wb-control) */
    --raised: #e2e8f0;      /* hover fill / highlighted row (wb-hover)     */
    --tile-track: #f1f5f9;  /* floating action chip over a thumbnail      */
    --ink: #1e293b;         /* slate-800 primary text (wb-label)          */
    --muted: #64748b;       /* slate-500 secondary text (wb-label-muted)  */
    --accent: #ea580c;      /* orange-600 (wb-accent) — active + selection */
    --accent-2: #c2410c;    /* pressed/hover shade of the accent           */
    --on-accent: #ffffff;   /* text/icon color drawn on the accent fill    */
    --ok: #15803d; --ok-soft: rgba(34,197,94,.14);
    --pending: #b45309; --pending-soft: rgba(245,158,11,.16);
    --danger: #dc2626; --danger-soft: #fef2f2;
    --grid-line: #bcbcbc;   /* authored Grid Line tool (wb-grid)          */
    --wall: #555555;        /* wall geometry ink (wb-ink)                  */
    --ref-line: #8c8c8c;    /* reference/dimension ink (wb-ink-2)          */
    --border: #e2e8f0;      /* slate-200 hairline (wb-panel-edge)          */
    --menu-edge: #cbd5e1;
    --menu-shadow: 0 12px 28px rgba(15,23,42,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--gutter);
    color: var(--ink);
    overflow: hidden;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  /* Custom mode switcher (replaces a bare <select>) so each mode can carry
     its own Cedar Studio nav mark — circle/plated-room/split-plate/doors —
     the same glyphs the real app's rail uses for Element/Layout/Unit Plan/
     Product, per the icon key the user gave for the reference screenshot. */
  #modeBtn {
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .1px;
    background: none; color: var(--ink); border: 1px solid transparent;
    border-radius: 7px; padding: 5px 8px 5px 6px; cursor: pointer;
  }
  #modeBtn:hover, #modeBtn.open { background: var(--raised); }
  #modeBtn .mark { display:flex; color: var(--accent); flex-shrink: 0; }
  #modeBtn .mark svg, #modeMenu .opt .mark svg { width: 15px; height: 15px; display: block; }
  #modeBtn .caret { color: var(--muted); display:flex; }
  #modeMenu {
    position: absolute; top: calc(100% + 6px); left: 14px; z-index: 60;
    min-width: 190px; background: var(--panel); border: 1px solid var(--menu-edge);
    border-radius: 10px; padding: 5px; box-shadow: var(--menu-shadow);
  }
  #modeMenu[hidden] { display: none; }
  #modeMenu .opt {
    display: flex; align-items: center; gap: 10px; padding: 7px 9px;
    border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  #modeMenu .opt .mark { display:flex; color: var(--muted); flex-shrink:0; }
  #modeMenu .opt:hover { background: var(--raised); }
  #modeMenu .opt.current { background: var(--panel-2); font-weight: 600; }
  #modeMenu .opt.current .mark { color: var(--accent); }

  #toolbar {
    display: flex; flex-direction: column; gap: 2px; align-items: center;
    width: 56px; flex-shrink: 0; padding: 10px 0; overflow-x: hidden; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  /* Two tool shapes, matching the real rail: a nav button (Library/Insert/
     Push) is an icon chip with a tiny caption underneath; a drafting tool is
     an icon-only square with a native tooltip (the `title` attribute already
     on every .tool). */
  .tool {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; color: var(--ink);
    cursor: pointer; transition: .12s; flex-shrink: 0;
  }
  .tool .ic {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 7px; color: var(--ink);
  }
  .tool.navbtn .ic { width: 30px; height: 30px; border-radius: 8px; }
  .tool .lbl { font-size: 9px; letter-spacing: .01em; color: var(--muted); white-space: nowrap; }
  .tool:not(.navbtn) .lbl { display: none; }
  .tool:hover .ic { background: var(--raised); }
  .tool.active .ic { background: var(--accent); color: var(--on-accent); }
  .tool.active .lbl { color: var(--ink); }
  .tool.disabled { opacity: .35; pointer-events: none; }
  .tool svg { width: 17px; height: 17px; }
  .tool.navbtn svg { width: 16px; height: 16px; }
  .sep { width: 1px; height: 34px; background: var(--border); margin: 0 4px; }
  #toolbar .raildiv { width: 26px; height: 1px; background: var(--border); flex-shrink: 0; margin: 5px 0; }

  #toolbar .group {
    display: contents;
  }
  /* Element's sub-tools (Toilet/Table/Bed/Car) sit right under its own
     toggle button, inline within the Boundaries group — not a dropdown. */
  #elementSubTools { display: contents; }
  #elementSubTools[hidden] { display: none; }
  #toggleInsertBtn[hidden] { display: none; }
  #pushBranchesBtn[hidden] { display: none; }
  #toolbar .group.disabled { opacity: .35; pointer-events: none; }

  .field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .field input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); }

  #stage { position: relative; flex: 1; overflow: hidden; cursor: crosshair; background: var(--bg); }
  #stage canvas { display: block; position: absolute; inset: 0; }

  #hud {
    position: absolute; bottom: 10px; left: 12px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; color: var(--muted);
    pointer-events: none; font-variant-numeric: tabular-nums;
    box-shadow: var(--menu-shadow);
  }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: inherit;
  }
  #menu {
    position: absolute; z-index: 50; min-width: 150px;
    background: var(--panel); border: 1px solid var(--menu-edge);
    border-radius: 8px; padding: 5px; display: none;
    box-shadow: var(--menu-shadow);
  }
  #menu .item {
    padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 18px; align-items: center;
  }
  #menu .item:hover { background: var(--accent); color: var(--on-accent); }
  #menu .item.danger:hover { background: var(--danger); color: #fff; }
  #menu .item .sc { color: var(--muted); font-size: 11px; }
  #menu .item:hover .sc { color: rgba(255,255,255,.8); }
  #menu .divider { height: 1px; background: var(--border); margin: 4px 2px; }

  #flexPanel {
    position: absolute; top: 12px; right: 12px; z-index: 40; width: 240px;
    background: var(--panel); border: 1px solid var(--menu-edge); border-radius: 10px;
    padding: 12px; display: none; box-shadow: var(--menu-shadow);
  }
  #flexPanel h3 { font-size: 12px; font-weight: 600; margin-bottom: 2px; color: var(--accent); }
  #flexPanel .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  #flexPanel .seg { margin-bottom: 9px; }
  #flexPanel .seg .lbl { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
  #flexPanel .seg .lbl .len { color: var(--muted); }
  #flexPanel .seg .lbl .pct { color: var(--accent); font-variant-numeric: tabular-nums; }
  #flexPanel input[type=range] { width: 100%; accent-color: var(--accent); }
  #flexPanel .foot { font-size: 10px; color: var(--muted); margin-top: 6px; }

  #main { display: flex; flex: 1; min-height: 0; }
  .panel {
    width: 232px; flex-shrink: 0; min-width: 0;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
  }
  .panel[hidden] { display: none; }
  .panel h3 { font-size: 13px; font-weight: 600; padding: 14px 14px 10px; color: var(--ink); border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  /* Two tiles per row, matching the real Library/Insert palettes. */
  .panel .list { padding: 0 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; align-content: start; }
  .panel .list[hidden] { display: none; }
  .panel .item {
    border-radius: 8px; cursor: pointer; overflow: visible; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; text-align: center;
    /* A grid item's automatic min-width is its content's min-content size by
       default, which a long name (a branch's is often long — "X_4_Product
       Name") can make wider than the track it's meant to share — blowing the
       2-column grid to a lopsided 1-and-a-sliver split. min-width:0 lets it
       shrink to the assigned track instead; the name/dims still ellipsize. */
    min-width: 0;
  }
  .panel .item:hover { background: var(--raised); }
  .panel .item canvas {
    display: block; width: 100%; aspect-ratio: 1 / 1; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .panel .item.open canvas { border-color: var(--danger); border-width: 2px; }
  .panel .item.archived canvas { opacity: .55; }
  .panel .item.archived .nm .suffix { color: var(--danger); }
  .panel .item.placing canvas { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .panel .item .nm { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; font-size: 12px; color: var(--ink); }
  .panel .item .nm .suffix { color: var(--muted); font-size: 11px; }
  .panel .item .nm .label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel .item .nm input[type=text] {
    width: 100%; min-width: 0; background: none; border: 1px solid transparent;
    color: var(--ink); border-radius: 5px; padding: 2px 4px; font-size: 12.5px; text-align: center;
  }
  .panel .item .nm input[type=text]:hover, .panel .item .nm input[type=text]:focus {
    background: var(--panel-2); border-color: var(--border);
  }
  .panel .item .dims { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  /* Hover-only action chip floating over the thumbnail's corner, not a
     permanent row — matches the real Library tile's per-file toolbar. */
  .panel .item .actions {
    position: absolute; top: 6px; right: 6px; display: flex; gap: 2px;
    background: var(--tile-track); border: 1px solid var(--menu-edge); border-radius: 6px;
    padding: 2px; opacity: 0; pointer-events: none; transition: opacity .1s;
  }
  .panel .item:hover .actions, .panel .item .actions:focus-within { opacity: 1; pointer-events: auto; }
  .panel .item .actions button {
    background: none; border: none; color: var(--muted);
    border-radius: 5px; width: 22px; height: 22px; font-size: 10px; cursor: pointer;
  }
  /* Pushed branches waiting for review in the Unit Plan/Layout Editor —
     amber to read as "pending," and a plain uppercase label naming
     the Product each group came from. */
  .panel .item.pushed canvas { border-color: var(--pending); }
  .panel .item.pushed .actions button.approve { color: var(--ok); }
  .panel .item.pushed .actions button.approve:hover { background: var(--ok-soft); }
  .panel .pushed-group-header {
    grid-column: 1 / -1;
    font-size: 10px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted);
    margin: 4px 2px 0; padding-top: 8px; border-top: 1px solid var(--border);
  }
  /* An original with branches, once clicked, stays highlighted so it's
     clear which one the Branches tray to the right is currently showing. */
  .panel .item.lib-selected canvas { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* Marks a root's preview as having branches. In the Insert panel this is a
     real button (a decorative, non-interactive span everywhere else) — sized
     up from a plain badge so it's actually easy to hit, since it's now the
     ONLY way to reach that card's branches (the card itself always inserts). */
  .panel .item span.branch-star {
    position: absolute; top: 4px; left: 4px; color: var(--pending); font-size: 15px;
    text-shadow: 0 1px 2px rgba(255,255,255,.7); pointer-events: none;
  }
  .panel .item button.branch-star {
    position: absolute; z-index: 1;
    /* The visible rounded frame is the CANVAS (8px radius), not .item — the
       canvas itself sits 4px in from .item's edge (.item's own padding).
       So the button's true inset from that frame is 4px (.item's padding)
       + 3px (this button's own margin) = 7px, and its own radius is
       concentric with the canvas's: 8 - 3 = 5px. */
    top: 7px; left: 7px;
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 1px solid transparent;
    border-radius: 5px;
    background: none; color: var(--pending); pointer-events: auto; font-size: 16px; cursor: pointer;
  }
  .panel .item button.branch-star:hover { background: var(--pending-soft); border-color: var(--pending); }
  /* The only way to create a Product — sits above the Product list. */
  .panel .item.add-new {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: center; height: 36px;
    border: 1px dashed var(--border); color: var(--muted); font-size: 18px; font-weight: 600; line-height: 1;
  }
  .panel .item.add-new:hover { border-color: var(--accent); color: var(--ink); background: var(--panel-2); }
  .panel h3 { display: flex; align-items: center; justify-content: space-between; }
  .panel h3 .close-tray-btn {
    background: none; border: none; color: var(--muted); font-size: 16px; line-height: 1;
    cursor: pointer; padding: 0 2px;
  }
  .panel h3 .close-tray-btn:hover { color: var(--ink); }
  .panel .empty-note { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; padding: 4px 2px 10px; }
  .panel .item .actions button:hover { background: var(--raised); color: var(--ink); }
  .panel .item .actions button.save:hover { color: var(--accent); }
  .panel .item .actions button.danger { color: var(--danger); }
  .panel .item .actions button.danger:hover { background: var(--danger-soft); color: var(--danger); }
  .panel .item .actions button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button type="button" id="modeBtn" title="Switch which kind of file you're editing">
      <span class="mark" id="modeBtnMark"></span>
      <span id="modeBtnLabel">Product Editor</span>
      <span class="caret"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 6.2L8 10l4-3.8"/></svg></span>
    </button>
    <div id="modeMenu" hidden>
      <div class="opt" data-mode="product"><span class="mark"></span>Product Editor</div>
      <div class="opt" data-mode="unitplan"><span class="mark"></span>Unit Plan Editor</div>
      <div class="opt" data-mode="layout"><span class="mark"></span>Layout Editor</div>
      <div class="opt" data-mode="element"><span class="mark"></span>Element Editor</div>
    </div>
    <div class="sep"></div>
    <span class="field" title="Show/hide dimensions by the container they were drawn in">Dims:</span>
    <label class="field" style="color:#3b82f6"><input id="showProductDims" type="checkbox" checked> Product</label>
    <label class="field" style="color:#10b981"><input id="showUnitplanDims" type="checkbox" checked> Unit</label>
    <label class="field" style="color:#d946ef"><input id="showLayoutDims" type="checkbox" checked> Layout</label>
  </header>

  <div id="main">
    <div id="toolbar">
      <div class="tool navbtn active" id="toggleLibraryBtn" title="Show/hide the Library panel">
        <span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1.2"/><rect x="9" y="2.2" width="4.8" height="4.8" rx="1.2"/><rect x="2.2" y="9" width="4.8" height="4.8" rx="1.2"/><rect x="9" y="9" width="4.8" height="4.8" rx="1.2"/></svg></span>
        <span class="lbl">Library</span>
      </div>
      <div class="tool navbtn" id="toggleInsertBtn" title="Show/hide the Insert panel">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 9v6M9 12h6"/></svg></span>
        <span class="lbl">Insert</span>
      </div>
      <div class="tool navbtn" id="pushBranchesBtn" title="Push this Product's branched Unit Plans/Layouts to the Unit Plan/Layout Editor libraries for review">
        <span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 12.4V5.2M5.2 8L8 5.2 10.8 8"/><path d="M2.8 2.6h10.4"/></svg></span>
        <span class="lbl">Push</span>
      </div>
      <div class="raildiv"></div>
      <div class="tool active" data-tool="select" title="Select / move (V)">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3l6 16 2-6 6-2z"/></svg></span>
        <span class="lbl">Select</span>
      </div>
      <div id="boundaryToolset">
        <div class="tool" data-tool="grid" title="Draw grid line (G)">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg></span>
          <span class="lbl">Grid line</span>
        </div>
        <div class="tool" data-tool="dim" title="Dimension (D)">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h18M3 9v6M21 9v6"/></svg></span>
          <span class="lbl">Dimension</span>
        </div>
        <div class="tool" data-tool="lockdim" title="Lock dimension (L) — forces the tagged element to keep this distance">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17h18M3 15v4M21 15v4"/><rect x="9" y="4" width="6" height="5" rx="1"/><path d="M10.5 4V3a1.5 1.5 0 0 1 3 0v1"/></svg></span>
          <span class="lbl">Lock Dim</span>
        </div>
        <div class="tool" data-tool="eqdim" title="EQ dimension (E) — forces tagged grids to equal spacing">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 14h18M3 12v4M21 12v4M9 12v4M15 12v4"/><path d="M6 6h5M6 9h5"/></svg></span>
          <span class="lbl">EQ Dim</span>
        </div>
        <div class="tool" data-tool="flexdim" title="Flex dimension (F) — distribute size change across segments by %">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 14h18M3 12v4M21 12v4M8 12v4M14 12v4"/><path d="M4 6l4 3-4 0z" fill="currentColor"/><path d="M16 6h5"/></svg></span>
          <span class="lbl">Flex Dim</span>
        </div>
        <div class="tool" data-tool="wall6" title="Draw 6&quot; wall">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="10" width="18" height="4" rx="1"/></svg></span>
          <span class="lbl">6&quot; Wall</span>
        </div>
        <div class="tool" data-tool="wall12" title="Draw 12&quot; wall">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="8" width="18" height="8" rx="1"/></svg></span>
          <span class="lbl">12&quot; Wall</span>
        </div>
      </div>
      <div id="elementEditorToolset" hidden>
        <div class="tool" data-tool="dim" title="Reference dimension (D) — measure the shapes you're authoring; informational only">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h18M3 9v6M21 9v6"/></svg></span>
          <span class="lbl">Dimension</span>
        </div>
        <div class="tool" data-tool="shape:rect" title="Rounded rectangle — grey filled shape">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="6" width="16" height="12" rx="3" fill="currentColor" stroke="none"/></svg></span>
          <span class="lbl">Rounded Rect</span>
        </div>
        <div class="tool" data-tool="shape:line" title="Line">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20L20 4"/></svg></span>
          <span class="lbl">Line</span>
        </div>
        <div class="tool" data-tool="shape:point" title="Insertion point — exactly one per element, marks where it anchors when placed">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></span>
          <span class="lbl">Insertion Pt</span>
        </div>
      </div>
    </div>
    <div id="tray" class="panel">
      <h3 id="libraryTitle">Library</h3>
      <div class="list" id="productsList"></div>
      <div class="list" id="unitplansList"></div>
      <div class="list" id="layoutsList"></div>
      <div class="list" id="elementsList"></div>
    </div>
    <div id="branchesTray" class="panel" hidden>
      <h3><span id="branchesTitleText">Branches</span><button type="button" id="closeBranchesBtn" class="close-tray-btn" title="Close">&times;</button></h3>
      <div class="list" id="branchesList"></div>
    </div>
    <div id="insertPanel" class="panel" hidden>
      <h3 id="insertTitle">Insert</h3>
      <div class="list" id="insertList"></div>
    </div>
    <div id="insertBranchesTray" class="panel" hidden>
      <h3><span id="insertBranchesTitleText">Versions</span><button type="button" id="closeInsertBranchesBtn" class="close-tray-btn" title="Close">&times;</button></h3>
      <div class="list" id="insertBranchesList"></div>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="menu"></div>
      <div id="flexPanel"></div>
      <div id="hud"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const offCanvas = document.createElement('canvas'); // wall-merge compositing layer
  const offCtx = offCanvas.getContext('2d');
  let dpr = 1;
  const stage = document.getElementById('stage');

  // ---- World model ----------------------------------------------------------
  // World units = feet. 1 foot of model = PPF pixels at scale 1.
  const PPF = 24; // pixels per foot at zoom 1
  // Wall thickness (feet) per wall tool. Each wall stores its own thickness.
  const WALL_THK = { wall6: 6/12, wall12: 12/12 };
  const state = {
    tool: 'select',
    editorMode: 'product', // 'product'|'unitplan'|'layout'|'element' — which kind of
                  // standalone file the header dropdown, "+", and top-level Library
                  // are currently pointed at (Product Editor's own nested boxes are
                  // unaffected by this — it only matters at the top level)
    gridSpacing: 2,        // feet
    snap: true,
    view: { x: 0, y: 0, scale: 1 }, // pan in px, zoom factor
    boxes: [],       // {id, x1,y1,x2,y2} feet (normalized)
    gridlines: [],   // {id, type:'v'|'h', pos} pos in feet (world x for v, world y for h)
    walls: [],       // {id, a:{x,y}, b:{x,y}}  feet
    dims: [],        // {id, a:{x,y}, b:{x,y}, off}  feet, off=offset feet
    elements: [],    // {id, ref:{x,y,xRef,yRef}, rot}  1×1 ft square, ref = insertion point
    elementShapes: [], // {id, elementId, kind:'rect'|'line', x1,y1,x2,y2} — the grey
                  // rounded-rects and lines an Element (drawn in the Element Editor)
                  // is made of. elementId is the top-level 'element' box that owns it.
    showDims: { product:true, unitplan:true, layout:true, element:true }, // dim visibility per container kind
    cancelSnapshots: {}, // boxId -> collectSubtreeFull() taken the moment a nested
                  // Unit Plan/Layout was opened in Product Editor, so "Close and
                  // Cancel" can throw away everything done since and revert to
                  // it — transient (not persisted): a reload already discards
                  // any unsaved edit, so there's nothing to restore across one.
    selection: null, // {kind, id}
    inserting: null, // {sourceId, picks:[{axis,ref,coord}]} while picking 4 grids to insert a copy
    multiSelection: [], // [{kind,id}, ...] from a click-drag marquee select
    archived: [], // [{id, kind, name, snapshot}] — boundaries deleted from the
                  // canvas, kept as reusable masters (Library/Insert still list
                  // them, and you can still place fresh instances of them)
    branchRootId: null,   // id of the root box/archived entry whose branches
    branchRootKind: null, // are currently shown in the Branches tray — UI-only,
                  // not persisted; stays set (and its card stays blue) until
                  // another root is clicked or the tray is closed
    insertBranchRootId: null,   // same idea, for the Insert panel's own
    insertBranchRootKind: null, // Versions tray (lists a root's insertable
                  // versions: the original plus every branch)
    placingCustomElementId: null, // which authored Element (from the Insert
                  // panel, in an open Layout) tool 'element:custom' is
                  // about to drop on the next click
  };
  let nextId = 1;
  const uid = () => nextId++;

  // ---- Transforms -----------------------------------------------------------
  function w2s(p) { // world feet -> screen px
    return {
      x: p.x * PPF * state.view.scale + state.view.x,
      y: p.y * PPF * state.view.scale + state.view.y
    };
  }
  function s2w(p) { // screen px -> world feet
    return {
      x: (p.x - state.view.x) / (PPF * state.view.scale),
      y: (p.y - state.view.y) / (PPF * state.view.scale)
    };
  }
  const ppfNow = () => PPF * state.view.scale;

  // ---- Resize ---------------------------------------------------------------
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
    offCanvas.width = cv.width; offCanvas.height = cv.height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  // ---- Snapping -------------------------------------------------------------
  function snapWorld(wp) {
    if (!state.snap) return { ...wp };
    let best = { ...wp };
    const tol = 14 / ppfNow(); // 14px tolerance in feet
    // snap to gridline intersections / lines first (priority)
    let sx = null, sy = null, dxBest = tol, dyBest = tol;
    for (const g of state.gridlines) {
      const gp = gridPos(g);
      if (g.type === 'v') { const d = Math.abs(wp.x - gp); if (d < dxBest) { dxBest = d; sx = gp; } }
      else { const d = Math.abs(wp.y - gp); if (d < dyBest) { dyBest = d; sy = gp; } }
    }
    // snap to wall endpoints
    let epBest = tol, ep = null;
    for (const wl of state.walls) {
      for (const e of [wl.a, wl.b]) {
        const d = Math.hypot(wp.x - e.x, wp.y - e.y);
        if (d < epBest) { epBest = d; ep = e; }
      }
    }
    if (ep) return { x: ep.x, y: ep.y, snapped: 'endpoint' };
    // background grid
    const gs = state.gridSpacing;
    const gx = Math.round(wp.x / gs) * gs;
    const gy = Math.round(wp.y / gs) * gs;
    if (Math.abs(wp.x - gx) < tol && sx === null) sx = gx;
    if (Math.abs(wp.y - gy) < tol && sy === null) sy = gy;
    if (sx !== null) best.x = sx;
    if (sy !== null) best.y = sy;
    return best;
  }

  // ---- Geometry helpers -----------------------------------------------------
  function distToSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const l2 = dx*dx + dy*dy;
    if (l2 === 0) return Math.hypot(p.x-a.x, p.y-a.y);
    let t = ((p.x-a.x)*dx + (p.y-a.y)*dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
  }

  // A wall/element/grid/dim only counts as hit/hoverable while it belongs to
  // the currently active (deepest-open) container — a closed nested
  // boundary's own contents stay untouchable until you actually open it.
  function belongsToActiveContainer(containerId){
    const ac = activeContainer();
    return containerId === (ac ? ac.id : null);
  }
  // A boundary itself is only selectable/hoverable/openable one level below
  // what's currently active (a Unit Plan only once its Product is open; a
  // Layout only once its Unit Plan is open — you can't reach into or even
  // highlight a level you haven't opened your way into), or the active
  // container itself (so you can still select/resize the thing you're
  // currently working inside). With nothing open, only top-level Products
  // qualify — once you're inside one, its ancestors (a Product while a
  // Unit Plan or Layout is open, a Unit Plan while its Layout is open)
  // stop being selectable too, not just their un-opened descendants.
  function boxInteractable(box){
    const ac = activeContainer();
    const activeId = ac ? ac.id : null;
    // nothing open means no Product is the current "file" — the canvas is
    // blank, so nothing on it (there shouldn't be anything drawn anyway) is
    // interactable; Products are only ever opened from the Library now.
    if (activeId===null) return false;
    return box.parentId === activeId || box.id === activeId;
  }
  function hitTest(wp) {
    const tol = 10 / ppfNow();
    for (let i=state.elements.length-1;i>=0;i--) {
      if (belongsToActiveContainer(state.elements[i].containerId) && pointInElement(wp, state.elements[i])) return { kind:'element', id:state.elements[i].id };
    }
    for (let i=state.elementShapes.length-1;i>=0;i--) {
      const sh = state.elementShapes[i];
      if (!belongsToActiveContainer(sh.elementId)) continue;
      if (sh.kind==='rect') {
        if (wp.x>=Math.min(sh.x1,sh.x2) && wp.x<=Math.max(sh.x1,sh.x2) && wp.y>=Math.min(sh.y1,sh.y2) && wp.y<=Math.max(sh.y1,sh.y2)) return { kind:'shape', id:sh.id };
      } else if (distToSeg(wp, {x:sh.x1,y:sh.y1}, {x:sh.x2,y:sh.y2}) < tol) return { kind:'shape', id:sh.id };
    }
    for (const wl of state.walls) {
      if (belongsToActiveContainer(wl.containerId) && distToSeg(wp, endPos(wl.a), endPos(wl.b)) < Math.max(tol, (wl.thickness||0.5)/2))
        return { kind: 'wall', id: wl.id };
    }
    for (const d of state.dims) {
      if (!belongsToActiveContainer(d.containerId)) continue;
      const ep = dimLineEndpoints(d);
      if (ep && distToSeg(wp, ep[0], ep[1]) < tol) return { kind: 'dim', id: d.id };
    }
    for (const g of state.gridlines) {
      if (!belongsToActiveContainer(g.boxId)) continue;
      const gp = gridPos(g);
      const bx = g.boxId != null ? findById(state.boxes, g.boxId) : null;
      const e = bx ? boxExt(bx) : null;
      if (g.type === 'v' && Math.abs(wp.x - gp) < tol) {
        if (!e || (wp.y>=e.y1-tol && wp.y<=e.y2+tol)) return { kind: 'grid', id: g.id };
      }
      if (g.type === 'h' && Math.abs(wp.y - gp) < tol) {
        if (!e || (wp.x>=e.x1-tol && wp.x<=e.x2+tol)) return { kind: 'grid', id: g.id };
      }
    }
    // pick the smallest box edge under the cursor so children win over parents
    let bHit=null, bArea=Infinity;
    for (const bx of state.boxes) {
      if (!boxInteractable(bx)) continue;
      const e = boxExt(bx);
      const onV = (Math.abs(wp.x-e.x1)<tol || Math.abs(wp.x-e.x2)<tol) && wp.y>e.y1-tol && wp.y<e.y2+tol;
      const onH = (Math.abs(wp.y-e.y1)<tol || Math.abs(wp.y-e.y2)<tol) && wp.x>e.x1-tol && wp.x<e.x2+tol;
      if (onV || onH) { const a=(e.x2-e.x1)*(e.y2-e.y1); if (a<bArea){bArea=a;bHit=bx.id;} }
    }
    if (bHit!=null) return { kind:'box', id:bHit };
    return null;
  }
  const findById = (arr, id) => arr.find(o => o.id === id);

  // Effective world extents of a box. Edges can be bound to grid lines (of a
  // parent box); a bound edge follows that grid line, so the box moves & scales
  // with the grids it sits on. Unbound edges use the box's own stored coords.
  function boxExt(bx) {
    const e = { x1:bx.x1, y1:bx.y1, x2:bx.x2, y2:bx.y2 };
    if (bx.bind) {
      for (const k of ['x1','y1','x2','y2']) {
        const ref = bx.bind[k];
        if (ref) { const v = resolveRef(ref); if (v != null) e[k] = v; }
      }
    }
    if (e.x1 > e.x2) { const t=e.x1; e.x1=e.x2; e.x2=t; }
    if (e.y1 > e.y2) { const t=e.y1; e.y1=e.y2; e.y2=t; }
    return e;
  }

  // Boundary nesting hierarchy: products hold unit plans hold layouts.
  const PARENT_KIND = { unitplan:'product', layout:'unitplan' };
  // Innermost OPEN boundary of the kind that may host `kind`, containing point p.
  function openHostFor(kind, p, excludeId) {
    const want = PARENT_KIND[kind];
    if (!want) return null;
    let best=null, bestArea=Infinity;
    for (const b of state.boxes) {
      if (b.id===excludeId || !b.open || b.kind!==want) continue;
      const e = boxExt(b);
      if (p.x>=e.x1 && p.x<=e.x2 && p.y>=e.y1 && p.y<=e.y2) {
        const area=(e.x2-e.x1)*(e.y2-e.y1);
        if (area<bestArea){bestArea=area;best=b;}
      }
    }
    return best;
  }
  function isBoxAncestor(ancId, box) {
    let p = box.parentId;
    while (p != null) { if (p===ancId) return true; const pb=findById(state.boxes,p); p = pb?pb.parentId:null; }
    return false;
  }
  // A boundary is "inactive" (faded) when one of its descendants is open.
  function boxHasOpenDescendant(box) {
    return state.boxes.some(b => b!==box && b.open && isBoxAncestor(box.id, b));
  }

  // Absolute world position (feet) of a grid line. Box-bound lines are stored as
  // a fraction `t` of the box span, so they move & scale with the box.
  function gridPos(g) {
    // A lock/EQ dimension can drive this grid, overriding normal box-fraction scaling.
    const dr = gridDriver(g.id);
    if (dr) { const p = driveResolve(dr); if (p != null) return p; }
    if (g.boxId != null) {
      const bx = findById(state.boxes, g.boxId);
      if (bx) { const e = boxExt(bx); return g.type==='v' ? e.x1 + g.t*(e.x2-e.x1) : e.y1 + g.t*(e.y2-e.y1); }
    }
    return g.pos;
  }
  // The drive-record (if any) by which a lock or EQ dimension constrains a grid.
  function gridDriver(gid) {
    for (const d of state.dims) if (d.drives)
      for (const dr of d.drives) if (dr.gridId===gid) return dr;
    return null;
  }
  // Resolve a drive record to a world coordinate.
  //   lock: anchorRef + fixed offset.   EQ: interpolation.   flex: %-distributed.
  function driveResolve(dr) {
    if (dr.kind==='flex') { const d=findById(state.dims, dr.dimId); return d ? flexGridPos(d, dr.k) : null; }
    if (dr.offset !== undefined) { const a=resolveRef(dr.anchorRef); return a!=null ? a+dr.offset : null; }
    if (dr.frac !== undefined) { const a=resolveRef(dr.anchorA), b=resolveRef(dr.anchorB); return (a!=null&&b!=null) ? a+dr.frac*(b-a) : null; }
    return null;
  }
  // Position of the grid at boundary k of a flex dimension. Each segment grows by
  // its share of the overall span change: segLen_i + (percent_i/Σpercent)·Δspan.
  function flexGridPos(d, k) {
    const A = resolveRef(d.firstRef), B = resolveRef(d.lastRef);
    if (A==null || B==null) return null;
    const total = (B - A) - d.S0;                  // overall size change since creation
    const denom = d.percents.reduce((s,p)=>s+p, 0);
    let cumL=0, cumShare=0;
    for (let i=0; i<k; i++) {
      cumL += d.segLens[i];
      cumShare += denom>0 ? d.percents[i]/denom : 1/d.percents.length;
    }
    return A + cumL + cumShare*total;
  }
  // The box whose effective extents contain a world point. Returns the innermost
  // (smallest-area) match so nested boxes resolve correctly.
  function boxContaining(p, opts={}) {
    let best=null, bestArea=Infinity;
    for (const b of state.boxes) {
      if (opts.openOnly && !b.open) continue;
      if (opts.exclude===b.id) continue;
      if (opts.interactableOnly && !boxInteractable(b)) continue;
      const e = boxExt(b);
      if (p.x>=e.x1 && p.x<=e.x2 && p.y>=e.y1 && p.y<=e.y2) {
        const area = (e.x2-e.x1)*(e.y2-e.y1);
        if (area < bestArea) { bestArea=area; best=b; }
      }
    }
    return best;
  }
  // Every box/wall/element/grid whose bounding box overlaps world-space rect
  // r={x1,y1,x2,y2} — used for the click-drag marquee multi-select.
  function itemsInRect(r){
    const overlaps = (bx1,by1,bx2,by2) => bx2>=r.x1 && bx1<=r.x2 && by2>=r.y1 && by1<=r.y2;
    const items = [];
    for (const b of state.boxes) {
      if (!boxInteractable(b)) continue;
      const e = boxExt(b);
      if (overlaps(e.x1,e.y1,e.x2,e.y2)) items.push({kind:'box', id:b.id});
    }
    for (const wl of state.walls) {
      if (!belongsToActiveContainer(wl.containerId)) continue;
      const a=endPos(wl.a), b=endPos(wl.b);
      if (overlaps(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.max(a.x,b.x),Math.max(a.y,b.y))) items.push({kind:'wall', id:wl.id});
    }
    for (const el of state.elements) {
      if (!belongsToActiveContainer(el.containerId)) continue;
      const cs = elementCorners(el);
      const xs=cs.map(c=>c.x), ys=cs.map(c=>c.y);
      if (overlaps(Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys))) items.push({kind:'element', id:el.id});
    }
    for (const g of state.gridlines) {
      if (!belongsToActiveContainer(g.boxId)) continue;
      const gp = gridPos(g);
      if (g.type==='v' ? (gp>=r.x1 && gp<=r.x2) : (gp>=r.y1 && gp<=r.y2)) items.push({kind:'grid', id:g.id});
    }
    for (const sh of state.elementShapes) {
      if (!belongsToActiveContainer(sh.elementId)) continue;
      if (overlaps(Math.min(sh.x1,sh.x2),Math.min(sh.y1,sh.y2),Math.max(sh.x1,sh.x2),Math.max(sh.y1,sh.y2))) items.push({kind:'shape', id:sh.id});
    }
    return items;
  }

  // ---- Wall endpoint anchoring ----------------------------------------------
  // A wall endpoint can be anchored to a reference whose coordinate it follows:
  //   {type:'grid', id}            → a grid line's position (gridPos)
  //   {type:'edge', boxId, edge}   → a box edge (x1/x2/y1/y2 from boxExt)
  // An endpoint has an xRef (vertical feature) and a yRef (horizontal feature);
  // their intersection is the anchored point. Unset refs fall back to free x/y.
  let resolveDepth = 0; // guard against accidental circular references
  function resolveRef(ref) {
    if (!ref || resolveDepth > 40) return null;
    resolveDepth++;
    try {
      if (ref.type==='grid') { const g=findById(state.gridlines, ref.id); return g ? gridPos(g) : null; }
      if (ref.type==='edge') { const b=findById(state.boxes, ref.boxId); return b ? boxExt(b)[ref.edge] : null; }
      // Element Editor reference dimensions: a corner of one of its own
      // authored rects/lines, or its insertion point — there are no
      // grids/box-edges to measure off of in there.
      if (ref.type==='shapeEdge') { const sh=findById(state.elementShapes, ref.shapeId); return sh ? sh[ref.edge] : null; }
      if (ref.type==='insertionPoint') { const b=findById(state.boxes, ref.elementId); return (b && b.insertionPoint) ? b.insertionPoint[ref.axis] : null; }
      return null;
    } finally { resolveDepth--; }
  }
  function endPos(ep) {
    const x = ep.xRef ? resolveRef(ep.xRef) : null;
    const y = ep.yRef ? resolveRef(ep.yRef) : null;
    return { x: x!=null ? x : ep.x, y: y!=null ? y : ep.y };
  }
  // A dimension/wall/element drawn while a container is open should only be
  // able to tag that container's own grids and its own boundary — never a
  // parent's or child's — even when they happen to sit at the same
  // coordinate (e.g. a Unit Plan that exactly fills its Product). With
  // nothing open, only top-level Products' own edges (and free grids) are
  // in scope.
  function ownFeatureBoxes(){
    const ac = activeContainer();
    return ac ? [ac] : state.boxes.filter(b=>b.kind==='product');
  }
  // Element Editor has no grids/walls to dimension off of, so its own
  // authored rects/lines (and the insertion point) stand in as the
  // reference features — purely informational ("how big is this thing"),
  // same rendering as any other dimension, just picked from shape corners
  // instead of grids/box edges.
  function elementShapeVFeatures(elId){
    const out=[];
    for (const sh of state.elementShapes) if (sh.elementId===elId) {
      out.push({coord:sh.x1, ref:{type:'shapeEdge',shapeId:sh.id,edge:'x1'}});
      out.push({coord:sh.x2, ref:{type:'shapeEdge',shapeId:sh.id,edge:'x2'}});
    }
    const box = findById(state.boxes, elId);
    if (box && box.insertionPoint) out.push({coord:box.insertionPoint.x, ref:{type:'insertionPoint',elementId:elId,axis:'x'}});
    return out;
  }
  function elementShapeHFeatures(elId){
    const out=[];
    for (const sh of state.elementShapes) if (sh.elementId===elId) {
      out.push({coord:sh.y1, ref:{type:'shapeEdge',shapeId:sh.id,edge:'y1'}});
      out.push({coord:sh.y2, ref:{type:'shapeEdge',shapeId:sh.id,edge:'y2'}});
    }
    const box = findById(state.boxes, elId);
    if (box && box.insertionPoint) out.push({coord:box.insertionPoint.y, ref:{type:'insertionPoint',elementId:elId,axis:'y'}});
    return out;
  }
  // Vertical features (give an x): vertical grid lines + box left/right edges.
  function vFeatures() {
    const out=[];
    const ac = activeContainer();
    const activeId = ac ? ac.id : null;
    for (const g of state.gridlines) if (g.type==='v' && g.boxId===activeId) out.push({coord:gridPos(g), ref:{type:'grid',id:g.id}});
    for (const b of ownFeatureBoxes()) { const e=boxExt(b);
      out.push({coord:e.x1, ref:{type:'edge',boxId:b.id,edge:'x1'}});
      out.push({coord:e.x2, ref:{type:'edge',boxId:b.id,edge:'x2'}});
    }
    if (ac && ac.kind==='element') out.push(...elementShapeVFeatures(ac.id));
    return out;
  }
  // Horizontal features (give a y): horizontal grid lines + box top/bottom edges.
  function hFeatures() {
    const out=[];
    const ac = activeContainer();
    const activeId = ac ? ac.id : null;
    for (const g of state.gridlines) if (g.type==='h' && g.boxId===activeId) out.push({coord:gridPos(g), ref:{type:'grid',id:g.id}});
    for (const b of ownFeatureBoxes()) { const e=boxExt(b);
      out.push({coord:e.y1, ref:{type:'edge',boxId:b.id,edge:'y1'}});
      out.push({coord:e.y2, ref:{type:'edge',boxId:b.id,edge:'y2'}});
    }
    if (ac && ac.kind==='element') out.push(...elementShapeHFeatures(ac.id));
    return out;
  }
  // Nearest intersection of a vertical & horizontal feature to a world point.
  // Covers grid×grid, grid×box-edge, and box-edge×box-edge (= box corner).
  function anchorAt(wp, tol) {
    const vs=vFeatures(), hs=hFeatures();
    let best=null, bestD=tol;
    for (const v of vs) for (const h of hs) {
      const d=Math.hypot(wp.x-v.coord, wp.y-h.coord);
      if (d<bestD) { bestD=d; best={x:v.coord, y:h.coord, xRef:v.ref, yRef:h.ref}; }
    }
    return best;
  }
  // Snap a wall endpoint: prefer an anchored intersection, then existing wall
  // endpoints, then the background grid. Returns an endpoint {x,y,xRef?,yRef?}.
  function wallSnap(wp) {
    if (!state.snap) return { x:wp.x, y:wp.y, xRef:null, yRef:null };
    const tol = 14 / ppfNow();
    const a = anchorAt(wp, tol);
    if (a) return a;
    let epBest=tol, ep=null;
    for (const wl of state.walls) for (const e of [wl.a, wl.b]) {
      const p=endPos(e); const d=Math.hypot(wp.x-p.x, wp.y-p.y);
      if (d<epBest) { epBest=d; ep=p; }
    }
    if (ep) return { x:ep.x, y:ep.y, xRef:null, yRef:null };
    const s = snapWorld(wp);
    return { x:s.x, y:s.y, xRef:null, yRef:null };
  }
  function bakeWallEnd(ep) { const p=endPos(ep); ep.x=p.x; ep.y=p.y; ep.xRef=null; ep.yRef=null; }
  function reanchorWall(wl) {
    const tol = 14 / ppfNow();
    for (const ep of [wl.a, wl.b]) {
      const p = endPos(ep);
      const a = anchorAt(p, tol);
      if (a) { ep.x=a.x; ep.y=a.y; ep.xRef=a.xRef; ep.yRef=a.yRef; }
      else { ep.x=p.x; ep.y=p.y; ep.xRef=null; ep.yRef=null; }
    }
  }

  function nearestFeature(val, arr, tol) {
    let best=null, bestD=tol;
    for (const f of arr) { const d=Math.abs(val-f.coord); if (d<bestD){bestD=d;best=f;} }
    return best;
  }
  // Pick a dimension reference (grid line OR box edge) near a world point.
  // `axis` constrains orientation once a string is started ('h' uses vertical
  // features, 'v' uses horizontal features). Returns {axis, ref, coord, perp}.
  function pickReference(wp, axis) {
    const tol = 12 / ppfNow();
    const cands = [];
    if (axis==null || axis==='h')
      for (const f of vFeatures()) cands.push({ d:Math.abs(wp.x-f.coord), axis:'h', ref:f.ref, coord:f.coord, perp:wp.y });
    if (axis==null || axis==='v')
      for (const f of hFeatures()) cands.push({ d:Math.abs(wp.y-f.coord), axis:'v', ref:f.ref, coord:f.coord, perp:wp.x });
    cands.sort((a,b)=>a.d-b.d);
    return (cands[0] && cands[0].d < tol) ? cands[0] : null;
  }
  const sameRef = (a,b) => {
    if (!a || !b || a.type!==b.type) return false;
    if (a.type==='grid') return a.id===b.id;
    if (a.type==='shapeEdge') return a.shapeId===b.shapeId && a.edge===b.edge;
    if (a.type==='insertionPoint') return a.elementId===b.elementId && a.axis===b.axis;
    return a.boxId===b.boxId && a.edge===b.edge;
  };

  // ---- Bounding box helpers -------------------------------------------------
  function boxCornerAt(bx, sp) {
    const e = boxExt(bx);
    const corners = {
      tl:w2s({x:e.x1,y:e.y1}), tr:w2s({x:e.x2,y:e.y1}),
      bl:w2s({x:e.x1,y:e.y2}), br:w2s({x:e.x2,y:e.y2})
    };
    for (const k in corners) {
      if (Math.hypot(sp.x-corners[k].x, sp.y-corners[k].y) < 8) return k;
    }
    return null;
  }
  // The innermost boundary whose corner is under the screen point (for resize).
  function boxCornerUnder(sp) {
    let best=null, bestArea=Infinity;
    for (const b of state.boxes) {
      if (!boxInteractable(b)) continue;
      const corner = boxCornerAt(b, sp);
      if (corner) {
        const e=boxExt(b), area=(e.x2-e.x1)*(e.y2-e.y1);
        if (area<bestArea) { bestArea=area; best={box:b, corner}; }
      }
    }
    return best;
  }
  // The Unit Plan/Layout you currently have open (Product Editor's nested
  // flow) can't be stretched by its own corners while you're inside it —
  // everything drawn against its edges (walls, grids, dims) would have to
  // rebind out from under you. Its own children resize normally; only ITS
  // boundary is locked, and only while it's the active (deepest-open) one.
  function boxResizeLocked(boxId){
    const ac = activeContainer();
    return !!(ac && ac.id===boxId && ac.parentId!=null && (ac.kind==='unitplan'||ac.kind==='layout'));
  }
  function resizeBox(drag, cur) {
    const bx = findById(state.boxes, drag.id);
    if (!bx.bind) bx.bind = {x1:null,y1:null,x2:null,y2:null};
    // manual resize detaches the dragged edges from any grid binding
    if (drag.corner.includes('l')) { bx.x1 = cur.x; bx.bind.x1=null; } else { bx.x2 = cur.x; bx.bind.x2=null; }
    if (drag.corner.includes('t')) { bx.y1 = cur.y; bx.bind.y1=null; } else { bx.y2 = cur.y; bx.bind.y2=null; }
  }
  function normalizeBox(bx) {
    if (bx.x1 > bx.x2) { const t=bx.x1; bx.x1=bx.x2; bx.x2=t; }
    if (bx.y1 > bx.y2) { const t=bx.y1; bx.y1=bx.y2; bx.y2=t; }
  }
  // Bake current effective extents into the free coords and drop all bindings,
  // so a box can be moved freely. Used when a drag starts.
  function bakeBox(bx) {
    const e = boxExt(bx);
    bx.x1=e.x1; bx.y1=e.y1; bx.x2=e.x2; bx.y2=e.y2;
    bx.bind = {x1:null,y1:null,x2:null,y2:null};
  }
  // Vertical/horizontal snap features offered by a host box: its own edges plus
  // the grid lines that belong to it. A child edge locks onto one of these, so
  // child corners lock to grid intersections, the host's edges, and its corners.
  function hostVFeatures(host) {
    const e = boxExt(host);
    const out = [
      { coord:e.x1, ref:{type:'edge',boxId:host.id,edge:'x1'} },
      { coord:e.x2, ref:{type:'edge',boxId:host.id,edge:'x2'} },
    ];
    for (const g of state.gridlines) if (g.boxId===host.id && g.type==='v') out.push({coord:gridPos(g), ref:{type:'grid',id:g.id}});
    return out;
  }
  function hostHFeatures(host) {
    const e = boxExt(host);
    const out = [
      { coord:e.y1, ref:{type:'edge',boxId:host.id,edge:'y1'} },
      { coord:e.y2, ref:{type:'edge',boxId:host.id,edge:'y2'} },
    ];
    for (const g of state.gridlines) if (g.boxId===host.id && g.type==='h') out.push({coord:gridPos(g), ref:{type:'grid',id:g.id}});
    return out;
  }
  // After a box is dropped, lock each edge to a nearby feature of the open box
  // that contains it. Bound edges then track those features (move & scale).
  function rebindBox(bx) {
    const e = boxExt(bx);
    const center = { x:(e.x1+e.x2)/2, y:(e.y1+e.y2)/2 };
    const host = openHostFor(bx.kind, center, bx.id);
    if (!host) { bx.parentId=null; bx.bind={x1:null,y1:null,x2:null,y2:null}; return; }
    bx.parentId = host.id;
    const tol = 16 / ppfNow();
    const vf = hostVFeatures(host), hf = hostHFeatures(host);
    const near = (val, arr) => {
      let best=null, bestD=tol;
      for (const f of arr) { const d=Math.abs(val-f.coord); if (d<bestD){bestD=d;best=f;} }
      return best;
    };
    const l=near(e.x1,vf), r=near(e.x2,vf), t=near(e.y1,hf), b=near(e.y2,hf);
    bx.bind = { x1:l?l.ref:null, x2:r?r.ref:null, y1:t?t.ref:null, y2:b?b.ref:null };
  }
  // After resizing, lock the dragged edge(s) onto a parent grid/edge they landed
  // on (or leave free if dropped away from one). Uses the box's existing parent
  // so it works whether or not the parent is currently open.
  function rebindResizedEdges(bx, edges) {
    const parent = bx.parentId!=null ? findById(state.boxes, bx.parentId) : null;
    if (!parent) return; // top-level products have no parent grids to lock to
    if (!bx.bind) bx.bind={x1:null,y1:null,x2:null,y2:null};
    const tol = 14 / ppfNow();
    const vf = hostVFeatures(parent), hf = hostHFeatures(parent);
    const e = boxExt(bx);
    const near = (val, arr) => { let best=null, bd=tol; for (const f of arr){ const d=Math.abs(val-f.coord); if(d<bd){bd=d;best=f;} } return best; };
    for (const k of edges) {
      const f = near(e[k], (k==='x1'||k==='x2') ? vf : hf);
      bx.bind[k] = f ? f.ref : null;
    }
  }

  // ---- Drawing --------------------------------------------------------------
  function fmtFeet(ft) {
    const sign = ft < 0 ? '-' : '';
    ft = Math.abs(ft);
    let whole = Math.floor(ft);
    let inches = Math.round((ft - whole) * 12);
    if (inches === 12) { whole += 1; inches = 0; }
    return `${sign}${whole}'-${inches}"`;
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);
    drawBackgroundGrid(w, h);
    drawWalls();
    drawGridlines(w, h);
    drawDims();
    drawElements();       // elements (dimmed if outside the focus)
    drawElementShapes();  // an open Element's own rects/lines/insertion point
    drawBoxes();          // boundary frames — selected/hover frontmost
    drawDimming();        // fade everything outside the open focus to white,
                  // frames included, so a sibling boundary's colored outline
                  // doesn't sit there un-faded while its walls/dims do
    drawHoverHighlight(); // hovered/Tab-cycled container, un-faded, on top
    drawInserting();      // edge picks while inserting a copy from the Insert panel
    drawPreview();
    updateHud();
    updateFlexPanel();
    updateToolAvailability();
    updateLibraryTitle();
  }

  function drawBackgroundGrid(w, h) {
    const gs = state.gridSpacing;
    const step = gs * ppfNow();
    if (step < 6) return; // too dense to show
    const tl = s2w({ x: 0, y: 0 });
    const br = s2w({ x: w, y: h });
    ctx.lineWidth = 1;
    const startX = Math.floor(tl.x / gs) * gs;
    const startY = Math.floor(tl.y / gs) * gs;
    for (let xf = startX; xf <= br.x; xf += gs) {
      const sx = w2s({ x: xf, y: 0 }).x;
      const major = Math.abs(xf % (gs*5)) < 1e-6;
      ctx.strokeStyle = major ? 'rgba(15,23,42,.08)' : 'rgba(15,23,42,.045)';
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
    }
    for (let yf = startY; yf <= br.y; yf += gs) {
      const sy = w2s({ x: 0, y: yf }).y;
      const major = Math.abs(yf % (gs*5)) < 1e-6;
      ctx.strokeStyle = major ? 'rgba(15,23,42,.08)' : 'rgba(15,23,42,.045)';
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
    }
    // origin marker
    const o = w2s({ x: 0, y: 0 });
    ctx.strokeStyle = 'rgba(255,120,120,.5)';
    ctx.beginPath(); ctx.moveTo(o.x-7,o.y); ctx.lineTo(o.x+7,o.y);
    ctx.moveTo(o.x,o.y-7); ctx.lineTo(o.x,o.y+7); ctx.stroke();
  }

  // Per-kind boundary outline color (closed). Open boundaries are red for all.
  const BOUNDARY_HUE = { product:217, unitplan:160, layout:292, element:38 };
  // Per-instance color: same base hue per kind, but sibling boxes vary in hue &
  // lightness so multiple layouts (or unit plans / products) are distinguishable.
  function boundaryColor(bx) {
    const hue = BOUNDARY_HUE[bx.kind] ?? 217;
    const sib = state.boxes.filter(b=>b.kind===bx.kind).sort((a,b)=>a.id-b.id);
    const i = Math.max(0, sib.findIndex(b=>b.id===bx.id));
    const h = hue + ((i*31)%30) - 15;     // ±15° hue spread
    const l = 34 + ((i*19)%28);           // 34–62% lightness — legible on a white canvas
    return `hsl(${h}, 62%, ${l}%)`;
  }
  // Draw boundary frames (no fill). Only the active (deepest-open) container is
  // red; the selected/hovered box draws frontmost — on top of even the red frame.
  function drawBoxes() {
    const order = { layout:0, unitplan:1, product:2 };
    const selId = (state.selection && state.selection.kind==='box') ? state.selection.id : null;
    const multiIds = new Set(state.multiSelection.filter(s=>s.kind==='box').map(s=>s.id));
    const ht = activeHover();
    const hoverBoxId = (ht && ht.kind==='box') ? ht.id : null;
    const active = activeContainer();
    const activeId = active ? active.id : null;
    const z = b => (b.id===hoverBoxId) ? 1001 : (b.id===selId||multiIds.has(b.id)) ? 1000 : (order[b.kind]??2);
    const visible = visibleBoxIds();
    const sorted = state.boxes.filter(b=>visible.has(b.id)).sort((a,b)=>z(a)-z(b));
    for (const bx of sorted) {
      const sel = bx.id===selId || multiIds.has(bx.id), hov = bx.id===hoverBoxId;
      const e = boxExt(bx);
      const p1 = w2s({x:e.x1,y:e.y1}), p2 = w2s({x:e.x2,y:e.y2});
      const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y);
      const ww=Math.abs(p2.x-p1.x), hh=Math.abs(p2.y-p1.y);
      const col = hov ? '#ffd54a' : (sel ? '#ea580c' : (bx.id===activeId ? '#ff5c5c' : boundaryColor(bx)));
      ctx.setLineDash([]);
      ctx.strokeStyle = col;
      ctx.lineWidth = (bx.id===activeId) ? 2.5 : (hov||sel ? 2.2 : 1.4);
      ctx.strokeRect(x,y,ww,hh);
      if (sel || hov) {
        ctx.fillStyle = col;
        for (const cn of [[x,y],[x+ww,y],[x,y+hh],[x+ww,y+hh]]) ctx.fillRect(cn[0]-4,cn[1]-4,8,8);
      }
    }
  }

  // Dim content outside each open boundary with a 25% white overlay; overlays
  // stack so the deepest-open boundary's interior is the brightest (the focus).
  // How far outward (feet) the mask cutout for `bx` should extend past its
  // own boundary line on each side, so it lines up with the OUTSIDE face of
  // whatever wall traces that edge instead of cutting through the middle of
  // it (a wall's centerline sits on the boundary, so its outer face sits
  // half a thickness beyond it). Looks at every wall in the currently
  // visible file, not just ones this box itself owns — a perimeter wall
  // tracing a nested box's edge is usually owned by the parent it was drawn
  // in. 0 on any side with no aligned wall (nothing to offset for).
  function boxWallExpansion(bx){
    const e = boxExt(bx);
    const exp = {x1:0, x2:0, y1:0, y2:0};
    const eps = 0.05; // feet — "on the edge" tolerance
    const visible = visibleBoxIds();
    for (const w of state.walls) {
      if (!visible.has(w.containerId)) continue;
      const a = endPos(w.a), b = endPos(w.b);
      const t = (w.thickness||0.5)/2;
      const spanY = [Math.min(a.y,b.y), Math.max(a.y,b.y)];
      const spanX = [Math.min(a.x,b.x), Math.max(a.x,b.x)];
      const overlapsY = spanY[0] < e.y2+eps && spanY[1] > e.y1-eps;
      const overlapsX = spanX[0] < e.x2+eps && spanX[1] > e.x1-eps;
      if (Math.abs(a.x-e.x1)<eps && Math.abs(b.x-e.x1)<eps && overlapsY) exp.x1 = Math.max(exp.x1, t);
      if (Math.abs(a.x-e.x2)<eps && Math.abs(b.x-e.x2)<eps && overlapsY) exp.x2 = Math.max(exp.x2, t);
      if (Math.abs(a.y-e.y1)<eps && Math.abs(b.y-e.y1)<eps && overlapsX) exp.y1 = Math.max(exp.y1, t);
      if (Math.abs(a.y-e.y2)<eps && Math.abs(b.y-e.y2)<eps && overlapsX) exp.y2 = Math.max(exp.y2, t);
    }
    return exp;
  }
  function drawDimming() {
    const opens = state.boxes.filter(b=>b.open);
    if (!opens.length) return;
    const W=cv.clientWidth, H=cv.clientHeight;
    for (const b of opens) {
      const e=boxExt(b);
      const exp=boxWallExpansion(b);
      const p1=w2s({x:e.x1-exp.x1,y:e.y1-exp.y1}), p2=w2s({x:e.x2+exp.x2,y:e.y2+exp.y2});
      const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y), ww=Math.abs(p2.x-p1.x), hh=Math.abs(p2.y-p1.y);
      ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(x,y,ww,hh);
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill('evenodd');
    }
  }

  // The hovered / Tab-cycled container drawn on top of EVERYTHING (including the
  // red open frames) so cycling clearly brings it to the front.
  function drawHoverHighlight() {
    const ht = activeHover();
    if (!ht) return;
    ctx.setLineDash([]); ctx.strokeStyle='#ffd54a'; ctx.lineWidth=3;
    if (ht.kind==='box') {
      const b=findById(state.boxes, ht.id); if (!b) return;
      const e=boxExt(b), p1=w2s({x:e.x1,y:e.y1}), p2=w2s({x:e.x2,y:e.y2});
      const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y), ww=Math.abs(p2.x-p1.x), hh=Math.abs(p2.y-p1.y);
      ctx.strokeRect(x,y,ww,hh);
      ctx.fillStyle='#ffd54a';
      for (const cn of [[x,y],[x+ww,y],[x,y+hh],[x+ww,y+hh]]) ctx.fillRect(cn[0]-4,cn[1]-4,8,8);
    } else if (ht.kind==='element') {
      const el=findById(state.elements, ht.id); if (!el) return;
      const cs=elementCorners(el).map(w2s);
      ctx.beginPath(); ctx.moveTo(cs[0].x,cs[0].y);
      for (let i=1;i<cs.length;i++) ctx.lineTo(cs[i].x,cs[i].y);
      ctx.closePath(); ctx.stroke();
    }
  }

  // ---- Elements -------------------------------------------------------------
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
  // Each plan-view symbol draws into a w×h ft footprint: x∈[-w/2,w/2], y∈[0,h]
  // (insertion point at the origin, footprint extending away from it — e.g.
  // away from the wall it's placed against). Call with the canvas already
  // translated to the insertion point, rotated by the element's angle, and
  // scaled to px/ft — lineWidth is pre-divided by that scale so strokes stay
  // a constant px width regardless of zoom.
  function drawToiletSymbol(c, { fill, stroke, lineWidth }, w, h) {
    c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = lineWidth;
    const tankH = 0.22*h;
    roundRectPath(c, -0.34*w, 0, 0.68*w, tankH, Math.min(w,h)*0.05);
    c.fill(); c.stroke();
    c.beginPath(); c.ellipse(0, 0.60*h, 0.30*w, 0.36*h, 0, 0, Math.PI*2);
    c.fill(); c.stroke();
    c.beginPath();
    c.moveTo(-0.10*w, tankH); c.lineTo(-0.10*w, tankH+0.06*h);
    c.moveTo(0.10*w, tankH); c.lineTo(0.10*w, tankH+0.06*h);
    c.stroke();
  }
  function drawTableSymbol(c, { fill, stroke, lineWidth }, w, h) {
    c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = lineWidth;
    roundRectPath(c, -w/2, 0, w, h, Math.min(w,h)*0.08);
    c.fill(); c.stroke();
  }
  function drawBedSymbol(c, { fill, stroke, lineWidth }, w, h) {
    c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = lineWidth;
    roundRectPath(c, -w/2, 0, w, h, Math.min(w,h)*0.05);
    c.fill(); c.stroke();
    const pw=w*0.38, ph=h*0.16, gap=w*0.06, py=h*0.06, pr=ph*0.3;
    c.beginPath(); roundRectPath(c, -pw-gap/2, py, pw, ph, pr); c.stroke();
    c.beginPath(); roundRectPath(c, gap/2, py, pw, ph, pr); c.stroke();
    c.beginPath(); c.moveTo(-w/2, h*0.34); c.lineTo(w/2, h*0.34); c.stroke();
  }
  function drawCarSymbol(c, { fill, stroke, lineWidth }, w, h) {
    c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = lineWidth;
    roundRectPath(c, -w/2, 0, w, h, w*0.3);
    c.fill(); c.stroke();
    c.beginPath();
    c.moveTo(-w*0.42, h*0.22); c.lineTo(w*0.42, h*0.22);
    c.moveTo(-w*0.42, h*0.74); c.lineTo(w*0.42, h*0.74);
    c.stroke();
  }
  // Footprint (feet) + plan symbol per element type. w = across, h = depth
  // (away from the wall/edge it's placed against).
  const ELEMENT_TYPES = {
    toilet: { label:'Toilet', w:1.5, h:2.5,  draw:drawToiletSymbol },
    table:  { label:'Table',  w:3,   h:5,    draw:drawTableSymbol },
    bed:    { label:'Bed',    w:5,   h:6.5,  draw:drawBedSymbol },
    car:    { label:'Car',    w:6.5, h:15,   draw:drawCarSymbol },
  };
  // A placed element is either a built-in fixture (el.type, one of the
  // hardcoded ELEMENT_TYPES) or a custom one authored in the Element Editor
  // (el.customElementId, pointing at a live top-level 'element' box) — the
  // latter's footprint is its own box extent, and its draw() replays its
  // authored rects/lines offset from its insertion point (so it renders the
  // same way here as it did while being drawn), using whatever fill/stroke/
  // hover/selection colors the caller already worked out.
  function elementType(el){
    if (el.customElementId!=null) {
      const box = findById(state.boxes, el.customElementId);
      if (box) {
        const e = boxExt(box);
        const w = Math.abs(e.x2-e.x1)||1, h = Math.abs(e.y2-e.y1)||1;
        const ip = box.insertionPoint || {x:(e.x1+e.x2)/2, y:(e.y1+e.y2)/2};
        const shapes = state.elementShapes.filter(sh=>sh.elementId===box.id);
        return { w, h, draw:(c,colors)=>{
          for (const sh of shapes) {
            const x1=sh.x1-ip.x, y1=sh.y1-ip.y, x2=sh.x2-ip.x, y2=sh.y2-ip.y;
            if (sh.kind==='rect') {
              const x=Math.min(x1,x2), y=Math.min(y1,y2), ww=Math.abs(x2-x1), hh=Math.abs(y2-y1);
              roundRectPath(c, x, y, ww, hh, Math.min(10, Math.min(ww,hh)/4 || 0));
              c.fillStyle=colors.fill; c.fill();
              c.strokeStyle=colors.stroke; c.lineWidth=colors.lineWidth; c.stroke();
            } else {
              c.strokeStyle=colors.stroke; c.lineWidth=colors.lineWidth;
              c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
            }
          }
        }};
      }
    }
    return ELEMENT_TYPES[el.type] || ELEMENT_TYPES.toilet;
  }
  // Tool ids for element placement are "element:<type>" (e.g. "element:table"),
  // or "element:custom" while placing a specific authored Element (its id is
  // in state.placingCustomElementId).
  function isElementTool(tool){ return tool.indexOf('element')===0; }
  function isShapeTool(tool){ return tool.indexOf('shape:')===0; }
  function currentElementType(){ return isElementTool(state.tool) ? state.tool.slice(8) : 'toilet'; }
  // Local geometry (insertion at origin, footprint extends +y), rotated by el.rot.
  function elementCorners(el) {
    const P = endPos(el.ref);
    const {w,h} = elementType(el);
    const a = (el.rot||0) * Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
    return [[-w/2,0],[w/2,0],[w/2,h],[-w/2,h]].map(([lx,ly])=>({
      x: P.x + lx*ca - ly*sa,
      y: P.y + lx*sa + ly*ca
    }));
  }
  function drawElements() {
    const ht = activeHover();
    const hoverElId = (ht && ht.kind==='element') ? ht.id : null;
    const multiIds = new Set(state.multiSelection.filter(s=>s.kind==='element').map(s=>s.id));
    const visible = visibleBoxIds();
    for (const el of state.elements) {
      if (!visible.has(el.containerId)) continue;
      const sel = (state.selection && state.selection.kind==='element' && state.selection.id===el.id) || multiIds.has(el.id);
      const hov = el.id===hoverElId;
      const P = w2s(endPos(el.ref));
      const scale = ppfNow();
      const {w,h,draw} = elementType(el);
      ctx.save();
      ctx.translate(P.x, P.y);
      ctx.rotate((el.rot||0) * Math.PI/180);
      ctx.scale(scale, scale);
      draw(ctx, {
        fill: sel ? '#fdba8c' : '#c2c8d2',
        stroke: hov ? '#ffd54a' : (sel ? '#ea580c' : '#6b7280'),
        lineWidth: (hov ? 3 : (sel ? 1.8 : 1)) / scale
      }, w, h);
      ctx.restore();
      // insertion / reference point (middle of a side)
      ctx.fillStyle = sel ? '#ea580c' : '#1e293b';
      ctx.beginPath(); ctx.arc(P.x,P.y,3.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=1; ctx.stroke();
    }
  }
  // An Element's own authored content: grey rounded rects and lines, plus
  // the single red crosshair marking its insertion point (where it anchors
  // once placed into a Layout).
  function drawElementShapes(){
    const visible = visibleBoxIds();
    const multiIds = new Set(state.multiSelection.filter(s=>s.kind==='shape').map(s=>s.id));
    for (const sh of state.elementShapes) {
      if (!visible.has(sh.elementId)) continue;
      const sel = (state.selection && state.selection.kind==='shape' && state.selection.id===sh.id) || multiIds.has(sh.id);
      const p1 = w2s({x:sh.x1,y:sh.y1}), p2 = w2s({x:sh.x2,y:sh.y2});
      if (sh.kind==='rect') {
        const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y), w=Math.abs(p2.x-p1.x), h=Math.abs(p2.y-p1.y);
        roundRectPath(ctx, x, y, w, h, Math.min(10, Math.min(w,h)/4));
        ctx.fillStyle = sel ? '#f0f2f3' : '#f6f7f8';
        ctx.fill();
        ctx.strokeStyle = sel ? '#ea580c' : '#3a4150';
        ctx.lineWidth = sel ? 2 : 1.2;
        ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle = sel ? '#ea580c' : '#3a4150';
        ctx.lineWidth = sel ? 2.4 : 1.6;
        ctx.stroke();
      }
    }
    for (const id of visible) {
      const bx = findById(state.boxes, id);
      if (!bx || bx.kind!=='element' || !bx.insertionPoint) continue;
      const p = w2s(bx.insertionPoint);
      ctx.strokeStyle='#ff5c5c'; ctx.fillStyle='#ff5c5c'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(p.x-6,p.y); ctx.lineTo(p.x+6,p.y); ctx.moveTo(p.x,p.y-6); ctx.lineTo(p.x,p.y+6); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
    }
  }
  function pointInElement(wp, el) {
    const c = elementCorners(el);
    let inside=false;
    for (let i=0,j=c.length-1;i<c.length;j=i++) {
      if (((c[i].y>wp.y)!==(c[j].y>wp.y)) &&
          (wp.x < (c[j].x-c[i].x)*(wp.y-c[i].y)/(c[j].y-c[i].y)+c[i].x)) inside=!inside;
    }
    return inside;
  }
  // Place an element: its insertion point snaps to an intersection (grid×grid,
  // grid×boundary-edge) or a boundary corner. `type` picks the fixture/furniture
  // symbol and footprint (see ELEMENT_TYPES).
  function placeElement(wp, type) {
    const a = anchorAt(wp, 16/ppfNow());
    if (!a) return;
    const id = uid();
    const ac = activeContainer();
    state.elements.push({ id, type, containerId: ac?ac.id:null, ref:{ x:a.x, y:a.y, xRef:a.xRef, yRef:a.yRef }, rot:0 });
    state.selection = { kind:'element', id };
    refreshTray();
  }
  // Same idea, but for a specific authored Element (picked from the Insert
  // panel) instead of a hardcoded fixture type.
  function placeCustomElement(wp, elementId) {
    const a = anchorAt(wp, 16/ppfNow());
    if (!a) return;
    const id = uid();
    const ac = activeContainer();
    state.elements.push({ id, customElementId:elementId, containerId: ac?ac.id:null, ref:{ x:a.x, y:a.y, xRef:a.xRef, yRef:a.yRef }, rot:0 });
    state.selection = { kind:'element', id };
    refreshTray();
  }
  // Arm placement of one specific authored Element — the next canvas click
  // (same grid/edge snapping as a built-in fixture) drops it.
  function startPlaceElement(elementId){
    state.placingCustomElementId = elementId;
    setTool('element:custom');
    buildInsertList();
  }
  // Place (or move) the one insertion point an Element (in the Element
  // Editor) has — where it anchors when the finished symbol gets placed
  // into a Layout. A second click just relocates the same single point.
  function placeInsertionPoint(wp){
    const ac = activeContainer();
    if (!ac || ac.kind!=='element') return;
    const p = state.snap ? snapWorld(wp) : wp;
    ac.insertionPoint = { x:p.x, y:p.y };
    state.selection = { kind:'box', id:ac.id };
    refreshTray();
  }

  function drawGridlines(w, h) {
    const ht = activeHover();
    const hoverGridId = (ht && ht.kind==='grid') ? ht.id : null;
    const multiIds = new Set(state.multiSelection.filter(s=>s.kind==='grid').map(s=>s.id));
    const visible = visibleBoxIds();
    for (const g of state.gridlines) {
      if (!visible.has(g.boxId)) continue;
      const gbx = g.boxId!=null ? findById(state.boxes, g.boxId) : null;
      if (gbx && !state.showDims[gbx.kind]) continue; // same Dims: toggle a container's grids ride along with its dims
      const sel = (state.selection && state.selection.kind==='grid' && state.selection.id===g.id) || multiIds.has(g.id);
      const hov = g.id===hoverGridId;
      const base = gbx ? boundaryColor(gbx) : '#8a94a3'; // match the container's color
      ctx.strokeStyle = hov ? '#ffd54a' : (sel ? '#fdba8c' : base);
      ctx.lineWidth = hov ? 2.5 : (sel ? 2 : 1.3);
      ctx.setLineDash([7, 5]);
      const gp = gridPos(g);
      if (g.boxId != null) {
        // bound to a box → render across that box only, scales/moves with it
        const bx = findById(state.boxes, g.boxId);
        if (!bx) { ctx.setLineDash([]); continue; }
        const e = boxExt(bx);
        ctx.beginPath();
        if (g.type === 'v') { const a=w2s({x:gp,y:e.y1}), b=w2s({x:gp,y:e.y2}); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
        else { const a=w2s({x:e.x1,y:gp}), b=w2s({x:e.x2,y:gp}); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
        ctx.stroke();
      } else {
        // free line (not in any box) → span the whole sheet
        ctx.beginPath();
        if (g.type === 'v') { const x = w2s({x:gp,y:0}).x; ctx.moveTo(x,0); ctx.lineTo(x,h); }
        else { const y = w2s({x:0,y:gp}).y; ctx.moveTo(0,y); ctx.lineTo(w,y); }
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }
  }

  // Walls render as the OUTLINE of their merged union, so intersections (L, T,
  // cross) join cleanly with no interior junction lines, while the interior
  // stays transparent. Done on an offscreen layer: fill every wall rectangle,
  // then punch out each rectangle's inset — what remains is the union outline.
  // Is this wall's endpoint joined to another wall (shared corner, or landing on
  // another wall's body for a T/cross)? Such ends get extended so the union fills
  // the outer corner instead of leaving a notch.
  function wallEndJoined(wall, P) {
    for (const o of state.walls) {
      if (o===wall) continue;
      const oa=endPos(o.a), ob=endPos(o.b);
      if (Math.hypot(P.x-oa.x,P.y-oa.y)<0.05 || Math.hypot(P.x-ob.x,P.y-ob.y)<0.05) return true;
      if (distToSeg(P, oa, ob) < 0.05) return true;
    }
    return false;
  }

  function drawWalls() {
    const T = 1.3; // outline thickness (px)
    const visible = visibleBoxIds();
    const visWalls = state.walls.filter(wl=>visible.has(wl.containerId));
    const rects = visWalls.map(wl=>{
      let aW=endPos(wl.a), bW=endPos(wl.b);
      const H=(wl.thickness||0.5)/2;                 // half-thickness in feet
      const dx=bW.x-aW.x, dy=bW.y-aW.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
      // extend joined ends by H so the outer corner is fully covered & merged
      if (wallEndJoined(wl, aW)) aW={x:aW.x-ux*H, y:aW.y-uy*H};
      if (wallEndJoined(wl, bW)) bW={x:bW.x+ux*H, y:bW.y+uy*H};
      const A=w2s(aW), B=w2s(bW);
      const Hpx=Math.max(1.4, (wl.thickness||0.5)*ppfNow()/2);
      return { A, B, H:Hpx };
    });
    if (!rects.length) return;
    offCtx.setTransform(dpr,0,0,dpr,0,0);
    offCtx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    offCtx.globalCompositeOperation='source-over';
    // 1) union outline base: fill every wall rectangle with the outline color
    offCtx.fillStyle='#555555';
    for (const r of rects) fillWallRect(offCtx, r.A, r.B, r.H);
    // 2) white body: fill each rectangle's inset white, leaving the union outline
    offCtx.fillStyle='#ffffff';
    for (const r of rects) {
      const dx=r.B.x-r.A.x, dy=r.B.y-r.A.y, L=Math.hypot(dx,dy)||1;
      if (r.H-T <= 0.2 || L-2*T <= 0.2) continue; // too thin/short to hollow out
      const ux=dx/L, uy=dy/L;
      const Ai={x:r.A.x+ux*T, y:r.A.y+uy*T}, Bi={x:r.B.x-ux*T, y:r.B.y-uy*T};
      fillWallRect(offCtx, Ai, Bi, r.H-T);
    }
    // blit the merged white-filled walls onto the main canvas (device pixels, 1:1)
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(offCanvas,0,0); ctx.restore();
    // selection highlight (drawn normally on top)
    const multiWallIds = new Set(state.multiSelection.filter(s=>s.kind==='wall').map(s=>s.id));
    for (const wl of visWalls) {
      const sel = (state.selection && state.selection.kind==='wall' && state.selection.id===wl.id) || multiWallIds.has(wl.id);
      if (sel) {
        const a=w2s(endPos(wl.a)), b=w2s(endPos(wl.b));
        const thkPx=Math.max(2.8,(wl.thickness||0.5)*ppfNow());
        ctx.strokeStyle='#ea580c'; ctx.lineWidth=1.6; ctx.lineJoin='miter'; ctx.lineCap='butt';
        strokeWallRect(a, b, thkPx);
      }
    }
  }

  // Fill a wall rectangle (centerline a→b, half-thickness H) on the given context.
  function fillWallRect(c, A, B, H) {
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1;
    const nx=-dy/L*H, ny=dx/L*H;
    c.beginPath();
    c.moveTo(A.x+nx,A.y+ny);
    c.lineTo(B.x+nx,B.y+ny);
    c.lineTo(B.x-nx,B.y-ny);
    c.lineTo(A.x-nx,A.y-ny);
    c.closePath();
    c.fill();
  }

  // Outline of a wall as a closed rectangle (two long edges + square end caps).
  function strokeWallRect(a, b, thkPx) {
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*thkPx/2, ny=dx/len*thkPx/2;
    ctx.beginPath();
    ctx.moveTo(a.x+nx,a.y+ny);
    ctx.lineTo(b.x+nx,b.y+ny);
    ctx.lineTo(b.x-nx,b.y-ny);
    ctx.lineTo(a.x-nx,a.y-ny);
    ctx.closePath();
    ctx.stroke();
  }

  // Dimension model: { id, axis:'h'|'v', refs:[ref...], line }
  //   axis 'h' → horizontal dimension; refs are vertical features (resolve to x); line = y of the dim line.
  //   axis 'v' → vertical dimension;   refs are horizontal features (resolve to y); line = x of the dim line.
  // The dim line's perpendicular position follows its container: stored as an
  // offset (lineOff) from the container's top/left edge, so dragging the
  // container moves the dimension with it.
  function dimLine(d) {
    if (d.containerId!=null && d.lineOff!=null) {
      const b = findById(state.boxes, d.containerId);
      if (b) { const e=boxExt(b); return (d.axis==='h' ? e.y1 : e.x1) + d.lineOff; }
    }
    return d.line;
  }
  function drawDims() {
    const visible = visibleBoxIds();
    for (const d of state.dims) {
      if (!visible.has(d.containerId)) continue;
      if (d.container && !state.showDims[d.container]) continue; // hidden by toggle
      drawDimSpec(d, false,
        state.selection && state.selection.kind==='dim' && state.selection.id===d.id, null);
    }
  }

  function drawDimSpec(spec, preview, sel, liveCoord) {
    let coords = spec.refs.map(resolveRef).filter(v=>v!=null);
    if (liveCoord!=null) coords = coords.concat([liveCoord]);
    if (coords.length < 1) return;
    const eq = !!spec.eq;
    const flex = !eq && !!spec.flex;
    const lock = !eq && !flex && !!(spec.locked || spec.lock);
    // dims take the color of the container they were drawn in; fall back to the
    // dimension-type color (eq teal / flex blue / lock purple / plain amber)
    const cBox = spec.containerId!=null ? findById(state.boxes, spec.containerId) : null;
    const cc = cBox ? boundaryColor(cBox) : null;
    const base = cc || (eq ? '#3fd6c0' : flex ? '#6db3ff' : (lock ? '#c08cff' : '#ffb454'));
    const selC = cc || (eq ? '#9defe0' : flex ? '#b6d8ff' : (lock ? '#dcc2ff' : '#ffd591'));
    const color = sel ? selC : base;
    // for flex, show the segment's % allotment next to the length
    const pct = (i) => (spec.percents && spec.percents[i]!=null) ? ` · ${spec.percents[i]}%` : '';
    const label = (seg,i) => eq ? `EQ (${fmtFeet(seg)})` : flex ? fmtFeet(seg)+pct(i) : (lock?'🔒 ':'') + fmtFeet(seg);
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.2; ctx.setLineDash([]);
    const lineVal = dimLine(spec);
    const sorted = [...coords].sort((a,b)=>a-b);
    if (spec.axis==='h') {
      const yL = w2s({x:0,y:lineVal}).y;
      const sx = sorted.map(c=>w2s({x:c,y:lineVal}).x);
      if (sorted.length>=2) { ctx.beginPath(); ctx.moveTo(sx[0],yL); ctx.lineTo(sx[sx.length-1],yL); ctx.stroke(); }
      for (const x of sx) { ctx.beginPath(); ctx.moveTo(x,yL-9); ctx.lineTo(x,yL+9); ctx.stroke(); }
      for (let i=0;i<sorted.length-1;i++) dimText((sx[i]+sx[i+1])/2, yL, label(sorted[i+1]-sorted[i], i), 0, color);
    } else {
      const xL = w2s({x:lineVal,y:0}).x;
      const sy = sorted.map(c=>w2s({x:lineVal,y:c}).y);
      if (sorted.length>=2) { ctx.beginPath(); ctx.moveTo(xL,sy[0]); ctx.lineTo(xL,sy[sy.length-1]); ctx.stroke(); }
      for (const y of sy) { ctx.beginPath(); ctx.moveTo(xL-9,y); ctx.lineTo(xL+9,y); ctx.stroke(); }
      for (let i=0;i<sorted.length-1;i++) dimText(xL, (sy[i]+sy[i+1])/2, label(sorted[i+1]-sorted[i], i), -Math.PI/2, color);
    }
  }

  function dimText(mx, my, txt, ang, color) {
    ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
    ctx.font='600 12px Segoe UI, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    const tw=ctx.measureText(txt).width;
