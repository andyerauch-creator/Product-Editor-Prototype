    ctx.fillStyle='#ffffff'; ctx.fillRect(-tw/2-3,-15,tw+6,14);
    ctx.fillStyle = color;
    ctx.fillText(txt, 0, -2);
    ctx.restore();
  }

  // Endpoints (world coords) of a dimension's line, for hit-testing & fit.
  function dimLineEndpoints(d) {
    const coords = d.refs.map(resolveRef).filter(v=>v!=null);
    if (coords.length<2) return null;
    const lo=Math.min(...coords), hi=Math.max(...coords), L=dimLine(d);
    return d.axis==='h'
      ? [{x:lo,y:L},{x:hi,y:L}]
      : [{x:L,y:lo},{x:L,y:hi}];
  }

  // ---- Interaction ----------------------------------------------------------
  let drag = null;     // active operation
  let mouse = { x:0, y:0 };     // screen
  let mouseW = { x:0, y:0 };    // world snapped
  let mouseWRaw = { x:0, y:0 };
  let panning = null;
  let dimBuild = null;          // in-progress dimension string {axis, refs:[], line}
  let hoverList = [];           // overlapping containers under the cursor (topmost first)
  let hoverIdx = 0;             // which one is highlighted (Tab cycles)
  const hoverTarget = () => hoverList[hoverIdx] || null;
  const activeHover = () => (state.tool==='select' && !drag) ? hoverTarget() : null;

  // Containers (boundaries by edge, elements by body) under a screen point,
  // ordered topmost-first (elements, then product, unit plan, layout).
  function boxEdgeUnder(b, wp, tol) {
    const e=boxExt(b);
    const onV=(Math.abs(wp.x-e.x1)<tol||Math.abs(wp.x-e.x2)<tol)&&wp.y>e.y1-tol&&wp.y<e.y2+tol;
    const onH=(Math.abs(wp.y-e.y1)<tol||Math.abs(wp.y-e.y2)<tol)&&wp.x>e.x1-tol&&wp.x<e.x2+tol;
    return onV||onH;
  }
  function hoverCandidatesAt(sp) {
    const wp=s2w(sp), tol=10/ppfNow();
    const cands=[];
    for (const el of state.elements) if (belongsToActiveContainer(el.containerId) && pointInElement(wp,el)) cands.push({kind:'element', id:el.id, z:3});
    const zk={layout:0,unitplan:1,product:2};
    for (const b of state.boxes) if (boxInteractable(b) && boxEdgeUnder(b,wp,tol)) cands.push({kind:'box', id:b.id, z:(zk[b.kind]??2)});
    // grid lines cycle last (after all containers) — but a wall under the cursor
    // keeps priority, so walls drawn along a grid stay selectable
    const wallUnder = state.walls.some(wl => belongsToActiveContainer(wl.containerId) && distToSeg(wp, endPos(wl.a), endPos(wl.b)) < Math.max(tol,(wl.thickness||0.5)/2));
    if (!wallUnder) for (const g of state.gridlines) {
      if (!belongsToActiveContainer(g.boxId)) continue;
      const gp=gridPos(g);
      const bx = g.boxId!=null ? findById(state.boxes,g.boxId) : null;
      const e = bx ? boxExt(bx) : null;
      const on = g.type==='v'
        ? (Math.abs(wp.x-gp)<tol && (!e || (wp.y>=e.y1-tol && wp.y<=e.y2+tol)))
        : (Math.abs(wp.y-gp)<tol && (!e || (wp.x>=e.x1-tol && wp.x<=e.x2+tol)));
      if (on) cands.push({kind:'grid', id:g.id, z:-1});
    }
    cands.sort((a,b)=>b.z-a.z);
    return cands.map(c=>({kind:c.kind, id:c.id}));
  }
  const hoverKey = list => list.map(c=>c.kind+c.id).join(',');
  function refreshHover(sp) {
    const cands = (state.tool==='select' && !drag && !state.inserting) ? hoverCandidatesAt(sp) : [];
    if (hoverKey(cands) !== hoverKey(hoverList)) { hoverList = cands; hoverIdx = 0; }
  }

  function getScreen(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  stage.addEventListener('mousedown', (e) => {
    const sp = getScreen(e);
    hideBoxMenu();
    // Right-click over an element or box → let the context menu handle it (don't pan)
    if (e.button === 2 && (hitTest(s2w(sp))?.kind==='element' || boxContaining(s2w(sp), {interactableOnly:true}))) return;
    // Pan: middle mouse or space-drag or right button
    if (e.button === 1 || e.button === 2 || (e.button===0 && spaceDown)) {
      panning = { sx: sp.x, sy: sp.y, vx: state.view.x, vy: state.view.y };
      stage.style.cursor='grabbing';
      e.preventDefault();
      return;
    }
    if (e.button !== 0) return;
    const wp = s2w(sp);
    const snapped = snapWorld(wp);
    state.multiSelection = []; // any new canvas interaction drops a prior marquee selection

    // inserting a copy: each click picks a reference edge (grid or box edge)
    if (state.inserting) {
      const pk = pickReference(wp, null);
      if (pk && !state.inserting.picks.some(p=>sameRef(p.ref,pk.ref)))
        state.inserting.picks.push({ axis:pk.axis, ref:pk.ref, coord:pk.coord });
      if (pk) tryFinalizeInsert();
      draw(); return;
    }

    if (state.tool === 'select') {
      let hit = activeHover();   // the highlighted (hovered / Tab-cycled) target
      if (hit) {
        // clicking the highlighted container/grid selects it (and brings boxes to front);
        // a click on a hovered box's corner resizes it
        if (hit.kind==='box') {
          const bx = findById(state.boxes, hit.id);
          const corner = boxCornerAt(bx, sp);
          if (corner && !boxResizeLocked(bx.id)) {
            state.selection = { kind:'box', id:bx.id };
            drag = { kind:'resizeBox', id:bx.id, corner };
            draw(); return;
          }
        }
      } else {
        // no highlight → direct hit-test, with boundary-corner resize preference
        hit = hitTest(wp);
        const cornerHit = boxCornerUnder(sp);
        const wallFirst = hit && hit.kind==='wall' && state.selection
          && state.selection.kind==='wall' && state.selection.id===hit.id;
        if (cornerHit && !wallFirst && !boxResizeLocked(cornerHit.box.id)) {
          state.selection = { kind:'box', id:cornerHit.box.id };
          drag = { kind:'resizeBox', id:cornerHit.box.id, corner:cornerHit.corner };
          draw(); return;
        }
        // nothing on an edge/handle → select the innermost box under the cursor
        // (lets you click anywhere inside a layout to select it)
        if (!hit) { const cb = boxContaining(wp, {interactableOnly:true}); if (cb) hit = { kind:'box', id:cb.id }; }
      }
      state.selection = hit;
      // an open container can't be dragged out from under the work happening
      // inside it — resizing (handled above) is still fine, just not moving
      if (hit && hit.kind==='box' && findById(state.boxes, hit.id)?.open) {
        draw();
        return;
      }
      if (hit) {
        state.multiSelection = [];
        drag = { kind:'move', hit, start: snapped, orig: cloneEntity(hit) };
        // capture the box's current effective extent; it is baked into free
        // coords on first movement, then re-bound to grids on drop
        if (hit.kind==='box') drag.startExt = boxExt(findById(state.boxes, hit.id));
        if (hit.kind==='wall') { const wl=findById(state.walls, hit.id); drag.startA=endPos(wl.a); drag.startB=endPos(wl.b); }
        if (hit.kind==='dim') { drag.origLine = dimLine(findById(state.dims, hit.id)); }
        if (hit.kind==='element') { drag.startP = endPos(findById(state.elements, hit.id).ref); }
      } else {
        // empty space → click-drag a marquee to select everything it covers
        state.multiSelection = [];
        drag = { kind:'marquee', x1:wp.x, y1:wp.y, x2:wp.x, y2:wp.y };
      }
      draw();
      return;
    }
    if (state.tool === 'product' || state.tool === 'unitplan' || state.tool === 'layout') {
      drag = { kind:'box', boxKind:state.tool, x1:snapped.x, y1:snapped.y, x2:snapped.x, y2:snapped.y };
    } else if (isElementTool(state.tool)) {
      if (state.tool==='element:custom') placeCustomElement(wp, state.placingCustomElementId);
      else placeElement(wp, currentElementType());
    } else if (state.tool === 'grid') {
      drag = { kind:'grid', start: snapped };
    } else if (state.tool === 'wall6' || state.tool === 'wall12') {
      const ep = wallSnap(wp);
      drag = { kind:'wall', a: ep, b: {...ep}, thickness: WALL_THK[state.tool] };
    } else if (state.tool === 'shape:rect' || state.tool === 'shape:line') {
      drag = { kind:'shape', shapeKind: state.tool==='shape:rect'?'rect':'line', x1:snapped.x, y1:snapped.y, x2:snapped.x, y2:snapped.y };
    } else if (state.tool === 'shape:point') {
      placeInsertionPoint(wp);
    } else if (state.tool === 'dim' || state.tool === 'lockdim' || state.tool === 'eqdim' || state.tool === 'flexdim') {
      // Click picks a reference (grid line or box edge). Build a chain; Enter commits.
      const pick = pickReference(wp, dimBuild ? dimBuild.axis : null);
      if (pick) {
        if (!dimBuild) dimBuild = { axis:pick.axis, refs:[pick.ref], line:pick.perp,
          lock:(state.tool==='lockdim'), eq:(state.tool==='eqdim'), flex:(state.tool==='flexdim') };
        else if (!dimBuild.refs.some(r=>sameRef(r,pick.ref))) dimBuild.refs.push(pick.ref);
      }
    }
    draw();
  });

  window.addEventListener('mousemove', (e) => {
    const sp = getScreen(e);
    mouse = sp;
    if (panning) {
      state.view.x = panning.vx + (sp.x - panning.sx);
      state.view.y = panning.vy + (sp.y - panning.sy);
      draw();
      return;
    }
    mouseWRaw = s2w(sp);
    mouseW = snapWorld(mouseWRaw);
    if (drag) {
      if (drag.kind === 'wall') drag.b = wallSnap(mouseWRaw);
      else if (drag.kind === 'box') { drag.x2 = mouseW.x; drag.y2 = mouseW.y; }
      else if (drag.kind === 'shape') { drag.x2 = mouseW.x; drag.y2 = mouseW.y; }
      else if (drag.kind === 'resizeBox') resizeBox(drag, mouseW);
      else if (drag.kind === 'move') doMove(drag, mouseW);
      else if (drag.kind === 'marquee') { drag.x2 = mouseWRaw.x; drag.y2 = mouseWRaw.y; }
    } else {
      refreshHover(sp);   // update overlapping-container highlight under the cursor
    }
    draw();
  });
  stage.addEventListener('mouseleave', ()=>{ if(hoverList.length){ hoverList=[]; hoverIdx=0; draw(); } });

  window.addEventListener('mouseup', (e) => {
    if (panning) { panning=null; stage.style.cursor=''; updateCursor(); return; }
    if (!drag) return;
    if (drag.kind === 'box') {
      const w = Math.abs(drag.x2-drag.x1), h = Math.abs(drag.y2-drag.y1);
      if (w > 0.1 && h > 0.1) {
        const kind = drag.boxKind || 'product';
        const id=uid();
        const cx=(drag.x1+drag.x2)/2, cy=(drag.y1+drag.y2)/2;
        // unit plans must go in an open product; layouts in an open unit plan
        const ok = (kind==='product') || !!openHostFor(kind, {x:cx,y:cy}, null);
        if (ok) {
          const bx = { id, kind, name:null,
            x1:Math.min(drag.x1,drag.x2), y1:Math.min(drag.y1,drag.y2),
            x2:Math.max(drag.x1,drag.x2), y2:Math.max(drag.y1,drag.y2),
            parentId:null, open:false, bind:{x1:null,y1:null,x2:null,y2:null} };
          state.boxes.push(bx);
          rebindBox(bx); // attach to parent's grids/edges if applicable
          state.selection={kind:'box',id};
        }
      }
    } else if (drag.kind === 'resizeBox') {
      const bx = findById(state.boxes, drag.id);
      // lock the dragged edges onto any grid/edge they were dropped on
      rebindResizedEdges(bx, [drag.corner.includes('l')?'x1':'x2', drag.corner.includes('t')?'y1':'y2']);
      normalizeBox(bx);
    } else if (drag.kind === 'move' && drag.hit.kind==='box' && drag.baked) {
      rebindBox(findById(state.boxes, drag.hit.id));
    } else if (drag.kind === 'move' && drag.hit.kind==='wall' && drag.baked) {
      reanchorWall(findById(state.walls, drag.hit.id));
    } else if (drag.kind === 'move' && drag.hit.kind==='element' && drag.baked) {
      const el=findById(state.elements, drag.hit.id);
      const a=anchorAt(endPos(el.ref), 16/ppfNow());
      if (a) { el.ref.x=a.x; el.ref.y=a.y; el.ref.xRef=a.xRef; el.ref.yRef=a.yRef; }
    } else if (drag.kind === 'grid') {
      // Click drops a gridline at the click point. Shift held → horizontal, otherwise vertical.
      const b = drag.start;
      const type = shiftDown ? 'h' : 'v';
      const pos = type==='v' ? b.x : b.y;
      addGridline(type, pos, b);
    } else if (drag.kind === 'marquee') {
      const r = { x1:Math.min(drag.x1,drag.x2), x2:Math.max(drag.x1,drag.x2),
                  y1:Math.min(drag.y1,drag.y2), y2:Math.max(drag.y1,drag.y2) };
      // an essentially-unmoved click just deselects, same as any empty click
      if (r.x2-r.x1 > 0.05 || r.y2-r.y1 > 0.05) state.multiSelection = itemsInRect(r);
    } else if (drag.kind === 'wall') {
      const aW=endPos(drag.a), bW=endPos(drag.b);
      const len = Math.hypot(bW.x-aW.x, bW.y-aW.y);
      if (len > 0.05) {
        const id=uid();
        const ac=activeContainer();
        state.walls.push({ id, a:{...drag.a}, b:{...drag.b}, thickness: drag.thickness, containerId: ac?ac.id:null });
        state.selection={kind:'wall',id};
      }
    } else if (drag.kind === 'shape') {
      const dx=drag.x2-drag.x1, dy=drag.y2-drag.y1;
      // a rect needs real extent on both axes; a line just needs SOME length
      // (it can be purely horizontal or vertical)
      const bigEnough = drag.shapeKind==='rect' ? (Math.abs(dx)>0.05 && Math.abs(dy)>0.05) : (Math.abs(dx)>0.05 || Math.abs(dy)>0.05);
      const ac = activeContainer();
      if (bigEnough && ac && ac.kind==='element') {
        const id=uid();
        const shape = drag.shapeKind==='rect'
          ? { id, elementId:ac.id, kind:'rect', x1:Math.min(drag.x1,drag.x2), y1:Math.min(drag.y1,drag.y2), x2:Math.max(drag.x1,drag.x2), y2:Math.max(drag.y1,drag.y2) }
          : { id, elementId:ac.id, kind:'line', x1:drag.x1, y1:drag.y1, x2:drag.x2, y2:drag.y2 };
        state.elementShapes.push(shape);
        state.selection={kind:'shape',id};
      }
    }
    drag=null;
    refreshTray(); // any of the edits above can change a boundary's live preview
    draw();
  });

  // Commit the in-progress dimension string (≥2 refs) on Enter.
  function commitDim(){
    if (dimBuild && dimBuild.refs.length >= 2) {
      const id=uid();
      const ac = activeContainer();
      const dim = { id, axis:dimBuild.axis, refs:dimBuild.refs.slice(), line:dimBuild.line, container: ac ? ac.kind : null, containerId: ac ? ac.id : null };
      // store the dim line as an offset from the container so it moves with it
      if (ac) { const e=boxExt(ac); dim.lineOff = dimBuild.line - (dim.axis==='h' ? e.y1 : e.x1); }
      if (dimBuild.lock) { dim.locked = true; dim.drives = computeDrives(dimBuild.refs); }
      else if (dimBuild.eq) { dim.eq = true; dim.drives = computeEQDrives(dimBuild.refs); }
      else if (dimBuild.flex) { if (!setupFlex(dim, id)) { dimBuild=null; draw(); return; } }
      state.dims.push(dim);
      state.selection={kind:'dim',id};
    }
    dimBuild=null;
    draw();
  }
  // For a lock dimension, decide which references are forced. Box edges are
  // anchors (they move with their box); grid lines are driven to stay a fixed
  // distance from the anchor. Returns drive records consumed by gridPos().
  function computeDrives(refs){
    const anchor = refs.find(r=>r.type==='edge') || refs[0];
    const anchorCoord = resolveRef(anchor);
    if (anchorCoord==null) return [];
    const drives=[];
    for (const r of refs) {
      if (r.type!=='grid' || sameRef(r,anchor)) continue;
      const c = resolveRef(r);
      if (c==null) continue;
      drives.push({ gridId:r.id, anchorRef:anchor, offset:c-anchorCoord });
    }
    return drives;
  }
  // For an EQ dimension: distribute grid lines to equal spacing. Box edges (and
  // the two end references) are fixed anchors; grids between anchors interpolate.
  function computeEQDrives(refs){
    const ordered = refs.map(r=>({ref:r, coord:resolveRef(r)})).filter(o=>o.coord!=null).sort((a,b)=>a.coord-b.coord);
    const N = ordered.length;
    if (N < 3) return []; // need at least one grid between two anchors
    const anchorSet = new Set([0, N-1]);             // chain ends are always anchors
    ordered.forEach((o,i)=>{ if(o.ref.type==='edge') anchorSet.add(i); }); // box edges too
    const anchors = [...anchorSet].sort((a,b)=>a-b);
    const drives=[];
    for (let s=0; s<anchors.length-1; s++) {
      const i=anchors[s], j=anchors[s+1];
      for (let p=i+1; p<j; p++) {
        if (ordered[p].ref.type!=='grid') continue;
        drives.push({ gridId:ordered[p].ref.id, anchorA:ordered[i].ref, anchorB:ordered[j].ref, frac:(p-i)/(j-i) });
      }
    }
    return drives;
  }
  // For a flex dimension: record original segment lengths and per-segment percents.
  // First & last references are anchors; interior grids are driven by flexGridPos.
  function setupFlex(dim, id){
    const ordered = dim.refs.map(r=>({ref:r, coord:resolveRef(r)})).filter(o=>o.coord!=null).sort((a,b)=>a.coord-b.coord);
    const N = ordered.length;
    if (N < 3) return false; // need at least one interior grid to distribute across 2+ segments
    dim.refs = ordered.map(o=>o.ref);          // keep sorted order
    dim.flex = true;
    dim.firstRef = ordered[0].ref;
    dim.lastRef = ordered[N-1].ref;
    dim.segLens = [];
    for (let i=0;i<N-1;i++) dim.segLens.push(ordered[i+1].coord - ordered[i].coord);
    dim.S0 = ordered[N-1].coord - ordered[0].coord;
    const nseg = N-1;
    dim.percents = dim.segLens.map(()=>Math.round(100/nseg)); // default: even split
    dim.drives = [];
    for (let k=1; k<N-1; k++)
      if (ordered[k].ref.type==='grid') dim.drives.push({ kind:'flex', dimId:id, gridId:ordered[k].ref.id, k });
    return true;
  }

  function drawPreview() {
    if (!drag) {
      if (state.tool === 'grid') {
        const type = shiftDown ? 'h' : 'v';
        // preview in the color (and extent) of the container it would drop into
        const host = boxContaining(mouseW);
        const inHost = host && host.open;
        ctx.strokeStyle = inHost ? boundaryColor(host) : 'rgba(126,182,255,.55)';
        ctx.lineWidth=1.4; ctx.setLineDash([7,5]);
        ctx.beginPath();
        if (inHost) {
          const e=boxExt(host);
          if(type==='v'){const a=w2s({x:mouseW.x,y:e.y1}),b=w2s({x:mouseW.x,y:e.y2}); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);}
          else {const a=w2s({x:e.x1,y:mouseW.y}),b=w2s({x:e.x2,y:mouseW.y}); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);}
        } else {
          if(type==='v'){const x=w2s({x:mouseW.x,y:0}).x; ctx.moveTo(x,0); ctx.lineTo(x,cv.clientHeight);}
          else {const y=w2s({x:0,y:mouseW.y}).y; ctx.moveTo(0,y); ctx.lineTo(cv.clientWidth,y);}
        }
        ctx.stroke(); ctx.setLineDash([]);
      }
      if (state.tool === 'dim' || state.tool === 'lockdim' || state.tool === 'eqdim' || state.tool === 'flexdim') drawDimBuildPreview();
      if (isElementTool(state.tool)) {
        const a = anchorAt(mouseWRaw, 16/ppfNow());
        if (a) {
          const {w,h} = state.tool==='element:custom'
            ? elementType({customElementId: state.placingCustomElementId})
            : (ELEMENT_TYPES[currentElementType()] || ELEMENT_TYPES.toilet);
          const cs = [[-w/2,0],[w/2,0],[w/2,h],[-w/2,h]].map(([lx,ly])=>w2s({x:a.x+lx,y:a.y+ly}));
          ctx.beginPath(); ctx.moveTo(cs[0].x,cs[0].y);
          for (let i=1;i<cs.length;i++) ctx.lineTo(cs[i].x,cs[i].y);
          ctx.closePath();
          ctx.fillStyle='rgba(234,88,12,.25)'; ctx.fill();
          ctx.strokeStyle='#ea580c'; ctx.lineWidth=1.2; ctx.stroke();
          const P=w2s(a); ctx.fillStyle='#ea580c'; ctx.beginPath(); ctx.arc(P.x,P.y,3.5,0,Math.PI*2); ctx.fill();
        }
      }
      drawCursorMarker(); return;
    }
    if (drag.kind === 'wall') {
      const aW=endPos(drag.a), bW=endPos(drag.b);
      const a=w2s(aW), b=w2s(bW);
      const thkPx=Math.max(2, (drag.thickness||0.5)*ppfNow());
      ctx.lineJoin='miter'; ctx.lineCap='butt';
      ctx.strokeStyle='rgba(174,183,198,.85)'; ctx.lineWidth=1.2;
      strokeWallRect(a, b, thkPx);
      const len=Math.hypot(bW.x-aW.x,bW.y-aW.y);
      labelAt(b, fmtFeet(len));
    } else if (drag.kind === 'grid') {
      const b=mouseW;
      const type = shiftDown ? 'h' : 'v';
      ctx.strokeStyle='rgba(126,182,255,.8)'; ctx.lineWidth=1.4; ctx.setLineDash([7,5]);
      ctx.beginPath();
      if(type==='v'){const x=w2s({x:b.x,y:0}).x; ctx.moveTo(x,0); ctx.lineTo(x,cv.clientHeight);}
      else {const y=w2s({x:0,y:b.y}).y; ctx.moveTo(0,y); ctx.lineTo(cv.clientWidth,y);}
      ctx.stroke(); ctx.setLineDash([]);
    } else if (drag.kind === 'box') {
      const p1=w2s({x:drag.x1,y:drag.y1}), p2=w2s({x:drag.x2,y:drag.y2});
      const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y);
      const ww=Math.abs(p2.x-p1.x), hh=Math.abs(p2.y-p1.y);
      ctx.strokeStyle=`hsl(${BOUNDARY_HUE[drag.boxKind]??217}, 68%, 62%)`; ctx.lineWidth=1.6; ctx.setLineDash([]);
      ctx.strokeRect(x,y,ww,hh);
      labelAt(p2, `${fmtFeet(Math.abs(drag.x2-drag.x1))} × ${fmtFeet(Math.abs(drag.y2-drag.y1))}`);
    } else if (drag.kind === 'marquee') {
      const p1=w2s({x:drag.x1,y:drag.y1}), p2=w2s({x:drag.x2,y:drag.y2});
      const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y);
      const ww=Math.abs(p2.x-p1.x), hh=Math.abs(p2.y-p1.y);
      ctx.fillStyle='rgba(234,88,12,.10)'; ctx.fillRect(x,y,ww,hh);
      ctx.strokeStyle='#ea580c'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
      ctx.strokeRect(x,y,ww,hh); ctx.setLineDash([]);
    } else if (drag.kind === 'shape') {
      const p1=w2s({x:drag.x1,y:drag.y1}), p2=w2s({x:drag.x2,y:drag.y2});
      if (drag.shapeKind==='rect') {
        const x=Math.min(p1.x,p2.x), y=Math.min(p1.y,p2.y), ww=Math.abs(p2.x-p1.x), hh=Math.abs(p2.y-p1.y);
        roundRectPath(ctx, x, y, ww, hh, Math.min(10, Math.min(ww,hh)/4));
        ctx.fillStyle='rgba(246,247,248,.85)'; ctx.fill();
        ctx.strokeStyle='#ea580c'; ctx.lineWidth=1.2; ctx.stroke();
        labelAt(p2, `${fmtFeet(Math.abs(drag.x2-drag.x1))} × ${fmtFeet(Math.abs(drag.y2-drag.y1))}`);
      } else {
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle='#ea580c'; ctx.lineWidth=1.8; ctx.stroke();
        labelAt(p2, fmtFeet(Math.hypot(drag.x2-drag.x1, drag.y2-drag.y1)));
      }
    }
    drawCursorMarker();
  }

  // Preview the dimension string being built + highlight the reference under the cursor.
  function drawDimBuildPreview() {
    const pick = pickReference(mouseWRaw, dimBuild ? dimBuild.axis : null);
    // highlight the candidate reference line
    if (pick) {
      ctx.strokeStyle='rgba(255,180,84,.9)'; ctx.lineWidth=1.6; ctx.setLineDash([6,4]);
      ctx.beginPath();
      if (pick.axis==='h') { const x=w2s({x:pick.coord,y:0}).x; ctx.moveTo(x,0); ctx.lineTo(x,cv.clientHeight); }
      else { const y=w2s({x:0,y:pick.coord}).y; ctx.moveTo(0,y); ctx.lineTo(cv.clientWidth,y); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (dimBuild) {
      // preview takes the color of the container it will be committed into
      const ac = activeContainer();
      dimBuild.containerId = ac ? ac.id : null;
      const live = (pick && pick.axis===dimBuild.axis && !dimBuild.refs.some(r=>sameRef(r,pick.ref))) ? pick.coord : null;
      drawDimSpec(dimBuild, true, false, live);
    }
  }

  function labelAt(scr, txt){
    ctx.font='600 12px Segoe UI'; const tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(20,23,28,.9)'; ctx.fillRect(scr.x+10,scr.y-22,tw+10,18);
    ctx.fillStyle='#e6e9ef'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(txt, scr.x+15, scr.y-13);
  }

  function drawCursorMarker(){
    if (state.tool==='select' && !drag) return;
    const s=w2s(mouseW);
    ctx.strokeStyle='#ea580c'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(s.x,s.y,5,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s.x-9,s.y); ctx.lineTo(s.x+9,s.y);
    ctx.moveTo(s.x,s.y-9); ctx.lineTo(s.x,s.y+9); ctx.stroke();
  }

  // ---- Move/edit ------------------------------------------------------------
  function cloneEntity(hit){
    const o = getEntity(hit); return JSON.parse(JSON.stringify(o));
  }
  function getEntity(hit){
    if(hit.kind==='wall')return findById(state.walls,hit.id);
    if(hit.kind==='dim')return findById(state.dims,hit.id);
    if(hit.kind==='grid')return findById(state.gridlines,hit.id);
    if(hit.kind==='box')return findById(state.boxes,hit.id);
    if(hit.kind==='element')return findById(state.elements,hit.id);
    if(hit.kind==='shape')return findById(state.elementShapes,hit.id);
  }
  function doMove(drag, cur){
    const d = { x: cur.x-drag.start.x, y: cur.y-drag.start.y };
    const o = drag.orig, ent = getEntity(drag.hit);
    if(drag.hit.kind==='wall'){
      if(!drag.baked){ bakeWallEnd(ent.a); bakeWallEnd(ent.b); drag.baked=true; }
      ent.a.x=drag.startA.x+d.x; ent.a.y=drag.startA.y+d.y;
      ent.b.x=drag.startB.x+d.x; ent.b.y=drag.startB.y+d.y;
    } else if(drag.hit.kind==='dim'){
      // measured coords are locked to references; dragging just slides the dim line
      const newLine = drag.origLine + (ent.axis==='h' ? d.y : d.x);
      const cb = ent.containerId!=null ? findById(state.boxes, ent.containerId) : null;
      if (cb) { const e=boxExt(cb); ent.lineOff = newLine - (ent.axis==='h' ? e.y1 : e.x1); }
      else ent.line = newLine;
    } else if(drag.hit.kind==='grid'){
      if(ent.boxId != null){
        const bx = findById(state.boxes, ent.boxId);
        if(bx){
          const e = boxExt(bx);
          const span = ent.type==='v' ? (e.x2-e.x1) : (e.y2-e.y1);
          ent.t = o.t + (ent.type==='v' ? d.x : d.y)/(span||1);
        }
      } else {
        ent.pos = ent.type==='v' ? o.pos+d.x : o.pos+d.y;
      }
    } else if(drag.hit.kind==='box'){
      if(!drag.baked){ bakeBox(ent); drag.baked=true; }
      const s=drag.startExt;
      ent.x1=s.x1+d.x; ent.x2=s.x2+d.x; ent.y1=s.y1+d.y; ent.y2=s.y2+d.y;
    } else if(drag.hit.kind==='element'){
      if(!drag.baked){ bakeWallEnd(ent.ref); drag.baked=true; }
      ent.ref.x=drag.startP.x+d.x; ent.ref.y=drag.startP.y+d.y;
    } else if(drag.hit.kind==='shape'){
      // plain coordinates, no anchoring to bake — just slide both endpoints

  }

  // ---- Gridline management --------------------------------------------------
  function addGridline(type, pos, at){
    // A grid line can only go inside a box if that box is OPEN. If the point is
    // inside a closed box, block placement entirely.
    const inside = at ? boxContaining(at) : null;
    if (inside && !inside.open) { return; }
    const id=uid();
    if (inside) {
      // bind to the open box, stored as a fraction of its span so it moves & scales with it
      const e = boxExt(inside);
      const t = type==='v' ? (pos-e.x1)/(e.x2-e.x1) : (pos-e.y1)/(e.y2-e.y1);
      state.gridlines.push({ id, type, boxId:inside.id, t });
    } else {
      state.gridlines.push({ id, type, boxId:null, pos });
    }
    relabelGrid();
    state.selection={kind:'grid',id};
  }
  function relabelGrid(){
    // vertical lines get numbers (1,2,3 left->right), horizontal get letters (A,B.. top->bottom)
    const vs=state.gridlines.filter(g=>g.type==='v').sort((a,b)=>gridPos(a)-gridPos(b));
    const hs=state.gridlines.filter(g=>g.type==='h').sort((a,b)=>gridPos(a)-gridPos(b));
    vs.forEach((g,i)=>g.label=String(i+1));
    hs.forEach((g,i)=>g.label=String.fromCharCode(65+i));
  }

  // ---- HUD ------------------------------------------------------------------
  function updateHud(){
    const hud=document.getElementById('hud');
    const snapTxt = mouseW.snapped==='endpoint' ? ' · snap: endpoint' :
                    (state.snap ? ' · snap: on' : '');
    hud.textContent =
      `x ${fmtFeet(mouseW.x)}   y ${fmtFeet(mouseW.y)}   ·   zoom ${(state.view.scale*100|0)}%${snapTxt}`;
  }

  // ---- Zoom -----------------------------------------------------------------
  stage.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const sp=getScreen(e);
    const before=s2w(sp);
    const factor = e.deltaY<0 ? 1.12 : 1/1.12;
    state.view.scale = Math.max(0.15, Math.min(12, state.view.scale*factor));
    const after=s2w(sp);
    // keep cursor anchored
    state.view.x += (after.x-before.x)*ppfNow();
    state.view.y += (after.y-before.y)*ppfNow();
    draw();
  }, { passive:false });

  // ---- Context menu (right-click a box) -------------------------------------
  const menuEl = document.getElementById('menu');
  // Keep clicks on the menu from bubbling to the stage (whose mousedown would
  // otherwise hide the menu before the item's click handler runs).
  menuEl.addEventListener('mousedown', e=>e.stopPropagation());

  // ---- Flex distribution panel ----------------------------------------------
  const flexPanel = document.getElementById('flexPanel');
  flexPanel.addEventListener('mousedown', e=>e.stopPropagation()); // sliders don't deselect
  function updateFlexPanel(){
    const sel = state.selection;
    const d = (sel && sel.kind==='dim') ? findById(state.dims, sel.id) : null;
    const flexD = (d && d.flex) ? d : null;
    if (!flexD){ flexPanel.style.display='none'; flexPanel.dataset.dimId=''; return; }
    if (flexPanel.dataset.dimId !== String(flexD.id)) {
      buildFlexPanel(flexD);
      flexPanel.dataset.dimId = String(flexD.id);
    } else {
      const coords = flexD.refs.map(resolveRef).filter(v=>v!=null).sort((a,b)=>a-b);
      for (let i=0;i<flexD.segLens.length;i++){
        const lenEl = flexPanel.querySelector(`.seg[data-i="${i}"] .len`);
        if (lenEl && coords[i+1]!=null) lenEl.textContent = fmtFeet(coords[i+1]-coords[i]);
      }
    }
    flexPanel.style.display='block';
  }
  function buildFlexPanel(d){
    const coords = d.refs.map(resolveRef).filter(v=>v!=null).sort((a,b)=>a-b);
    let html = `<h3>Flex distribution</h3><div class="sub">Each segment's share of any size change</div>`;
    for (let i=0;i<d.percents.length;i++){
      const len = (coords[i+1]!=null) ? fmtFeet(coords[i+1]-coords[i]) : '';
      html += `<div class="seg" data-i="${i}">
        <div class="lbl"><span>Seg ${i+1} &nbsp;<span class="len">${len}</span></span><span class="pct">${d.percents[i]}%</span></div>
        <input type="range" min="0" max="100" value="${d.percents[i]}" data-i="${i}">
      </div>`;
    }
    html += `<div class="foot">Stretch a box edge — the change is split by these %.</div>`;
    flexPanel.innerHTML = html;
    flexPanel.querySelectorAll('input[type=range]').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const i=+e.target.dataset.i;
        d.percents[i] = +e.target.value;
        const pctEl = flexPanel.querySelector(`.seg[data-i="${i}"] .pct`);
        if (pctEl) pctEl.textContent = d.percents[i]+'%';

  }
  // Render a live preview of a Product/Unit Plan/Layout boundary's actual current
  // contents (nested boundaries, grids, walls, elements) into a small canvas,
  // read straight from live state.
  function drawLiveThumb(canvas, box){
    const c=canvas.getContext('2d'), cw=canvas.width, ch=canvas.height, pad=8;
    c.clearRect(0,0,cw,ch);
    const e=boxExt(box), W=(e.x2-e.x1)||1, H=(e.y2-e.y1)||1;
    const sc=Math.min((cw-2*pad)/W,(ch-2*pad)/H);
    const ox=(cw-W*sc)/2, oy=(ch-H*sc)/2;
    const SX=wx=>ox+(wx-e.x1)*sc, SY=wy=>oy+(wy-e.y1)*sc;
    c.strokeStyle='#7e879a'; c.lineWidth=1; c.strokeRect(ox,oy,W*sc,H*sc);
    // Scope to this box's own subtree (itself + descendants) by ownership,
    // not just world position — two unit plans/layouts can sit in different
    // products at overlapping coordinates, and a purely positional check
    // would leak an ancestor's (or an unrelated box's) grid lines in.
    const scopeIds = new Set([box.id]);
    for (const b of state.boxes) if (isBoxAncestor(box.id, b)) scopeIds.add(b.id);
    // nested boundaries (e.g. a product's unit plans, a unit plan's layouts)
    c.setLineDash([2,2]);
    for(const d of state.boxes){
      if(d.id===box.id || !scopeIds.has(d.id)) continue;
      const de=boxExt(d);
      c.strokeStyle=boundaryColor(d); c.lineWidth=1;
      c.strokeRect(SX(de.x1), SY(de.y1), (de.x2-de.x1)*sc, (de.y2-de.y1)*sc);
    }
    c.setLineDash([]);
    // grid lines actually bound to this box or one of its descendants
    c.strokeStyle='#7da0d0'; c.setLineDash([3,2]);
    for(const g of state.gridlines){
      if (g.boxId==null || !scopeIds.has(g.boxId)) continue;
      const gp=gridPos(g);
      c.beginPath();
      if(g.type==='v'){ if(gp<e.x1-0.05||gp>e.x2+0.05) continue; const x=SX(gp); c.moveTo(x,SY(e.y1)); c.lineTo(x,SY(e.y2)); }
      else { if(gp<e.y1-0.05||gp>e.y2+0.05) continue; const y=SY(gp); c.moveTo(SX(e.x1),y); c.lineTo(SX(e.x2),y); }

    // strictly from the container that was open when they were drawn
    // (containerId) — an untagged wall (drawn before that was tracked, or
    // with nothing open at all) has no known owner and is excluded rather
    // than guessed at by position, which is exactly how a parent's walls
    // were leaking into a nested box's preview.
    const owned = containerId => containerId!=null && scopeIds.has(containerId);
    // walls that belong to this box or one of its descendants
    for(const wl of state.walls){
      if(!owned(wl.containerId)) continue;
      const a=endPos(wl.a), b=endPos(wl.b);
      const ax=SX(a.x),ay=SY(a.y),bx=SX(b.x),by=SY(b.y);
      const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1, hpx=Math.max(1.2,(wl.thickness||0.5)*sc/2), nx=-dy/len*hpx, ny=dx/len*hpx;
      c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(ax+nx,ay+ny);c.lineTo(bx+nx,by+ny);c.lineTo(bx-nx,by-ny);c.lineTo(ax-nx,ay-ny);c.closePath();c.fill();
      c.strokeStyle='#555555';c.lineWidth=0.6;c.stroke();
    }
    // elements that belong to this box or one of its descendants
    for(const el of state.elements){
      if(!owned(el.containerId)) continue;
      const p=endPos(el.ref);
      const {w,h,draw} = elementType(el);
      c.save();
      c.translate(SX(p.x), SY(p.y));
      c.rotate((el.rot||0)*Math.PI/180);
      c.scale(sc, sc);
      draw(c, { fill:'#c2c8d2', stroke:'#6b7280', lineWidth: 1/sc }, w, h);
      c.restore();
    }
    // dimension lines that belong to this box or one of its descendants —
    // just the line itself at this size, no arrows/ticks/label text
    c.strokeStyle='#ffb454'; c.lineWidth=1; c.setLineDash([3,2]);
    for(const d of state.dims){
      if(!owned(d.containerId)) continue;
      const ep = dimLineEndpoints(d);
      if(!ep) continue;
      c.beginPath(); c.moveTo(SX(ep[0].x),SY(ep[0].y)); c.lineTo(SX(ep[1].x),SY(ep[1].y)); c.stroke();
    }
    c.setLineDash([]);
    // an Element's own shapes + insertion point (nothing to show for any
    // other kind, since ownership is by elementId, never anyone else's id)
    for (const sh of state.elementShapes) {
      if (!owned(sh.elementId)) continue;
      const p1x=SX(sh.x1),p1y=SY(sh.y1),p2x=SX(sh.x2),p2y=SY(sh.y2);
      if (sh.kind==='rect') {
        const x=Math.min(p1x,p2x), y=Math.min(p1y,p2y), ww=Math.abs(p2x-p1x), hh=Math.abs(p2y-p1y);
        roundRectPath(c, x, y, ww, hh, Math.min(4, Math.min(ww,hh)/4));
        c.fillStyle='#f6f7f8'; c.fill();
        c.strokeStyle='#3a4150'; c.lineWidth=1; c.stroke();
      } else {
        c.strokeStyle='#3a4150'; c.lineWidth=1; c.beginPath(); c.moveTo(p1x,p1y); c.lineTo(p2x,p2y); c.stroke();
      }
    }
    if (box.kind==='element' && box.insertionPoint) {
      const p=SX(box.insertionPoint.x), q=SY(box.insertionPoint.y);
      c.strokeStyle='#ff5c5c'; c.lineWidth=1;
      c.beginPath(); c.moveTo(p-3,q); c.lineTo(p+3,q); c.moveTo(p,q-3); c.lineTo(p,q+3); c.stroke();
    }
  }
  // Resolve a ref/endpoint against a frozen snapshot's own boxes/grids
  // (collectSubtreeFull's output) instead of live state — used to preview a
  // boundary that's been deleted from the canvas and archived.
  function snapshotResolveRef(snapshot, ref){
    if (!ref) return null;
    if (ref.type==='grid') {
      const g=findById(snapshot.grids, ref.id); if(!g) return null;
      const bx=findById(snapshot.boxes, g.boxId); if(!bx) return null;
      return g.type==='v' ? bx.x1+g.t*(bx.x2-bx.x1) : bx.y1+g.t*(bx.y2-bx.y1);
    }
    if (ref.type==='edge') { const bx=findById(snapshot.boxes, ref.boxId); return bx ? bx[ref.edge] : null; }
    return null;
  }
  function snapshotEndPos(snapshot, ep){
    const x = ep.xRef ? snapshotResolveRef(snapshot, ep.xRef) : null;
    const y = ep.yRef ? snapshotResolveRef(snapshot, ep.yRef) : null;
    return { x: x!=null?x:ep.x, y: y!=null?y:ep.y };
  }
  // Preview for an archived boundary (deleted from the canvas, kept as a

  // ownership filtering to do here.
  function drawSnapshotThumb(canvas, snapshot){
    const c=canvas.getContext('2d'), cw=canvas.width, ch=canvas.height, pad=8;
    c.clearRect(0,0,cw,ch);

    const W=(root.x2-root.x1)||1, H=(root.y2-root.y1)||1;
    const sc=Math.min((cw-2*pad)/W,(ch-2*pad)/H);
    const ox=(cw-W*sc)/2, oy=(ch-H*sc)/2;
    const SX=wx=>ox+(wx-root.x1)*sc, SY=wy=>oy+(wy-root.y1)*sc;
    c.strokeStyle='#7e879a'; c.lineWidth=1; c.strokeRect(ox,oy,W*sc,H*sc);
    c.setLineDash([2,2]);
    for(const bx of snapshot.boxes){
      if (bx.id===root.id) continue;
      c.strokeStyle=boundaryColor(bx); c.lineWidth=1;
      c.strokeRect(SX(bx.x1), SY(bx.y1), (bx.x2-bx.x1)*sc, (bx.y2-bx.y1)*sc);
    }
    c.setLineDash([]);
    c.strokeStyle='#7da0d0'; c.setLineDash([3,2]);
    for(const g of snapshot.grids){
      const bx = findById(snapshot.boxes, g.boxId); if (!bx) continue;
      const gp = g.type==='v' ? bx.x1+g.t*(bx.x2-bx.x1) : bx.y1+g.t*(bx.y2-bx.y1);
      c.beginPath();
      if(g.type==='v'){ const x=SX(gp); c.moveTo(x,SY(bx.y1)); c.lineTo(x,SY(bx.y2)); }
      else { const y=SY(gp); c.moveTo(SX(bx.x1),y); c.lineTo(SX(bx.x2),y); }
      c.stroke();
    }
    c.setLineDash([]);
    for(const wl of snapshot.walls){
      const a=snapshotEndPos(snapshot,wl.a), b=snapshotEndPos(snapshot,wl.b);
      const ax=SX(a.x),ay=SY(a.y),bx=SX(b.x),by=SY(b.y);
      const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1, hpx=Math.max(1.2,(wl.thickness||0.5)*sc/2), nx=-dy/len*hpx, ny=dx/len*hpx;
      c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(ax+nx,ay+ny);c.lineTo(bx+nx,by+ny);c.lineTo(bx-nx,by-ny);c.lineTo(ax-nx,ay-ny);c.closePath();c.fill();
      c.strokeStyle='#555555';c.lineWidth=0.6;c.stroke();
    }
    for(const el of snapshot.elements){
      const p=snapshotEndPos(snapshot, el.ref);
      const {w,h,draw} = elementType(el);
      c.save();
      c.translate(SX(p.x), SY(p.y));
      c.rotate((el.rot||0)*Math.PI/180);
      c.scale(sc, sc);
      draw(c, { fill:'#c2c8d2', stroke:'#6b7280', lineWidth: 1/sc }, w, h);
      c.restore();
    }
    c.strokeStyle='#ffb454'; c.lineWidth=1; c.setLineDash([3,2]);
    for(const d of snapshot.dims){
      const coords = d.refs.map(r=>snapshotResolveRef(snapshot,r)).filter(v=>v!=null);

      if (sh.kind==='rect') {
        const x=Math.min(p1x,p2x), y=Math.min(p1y,p2y), ww=Math.abs(p2x-p1x), hh=Math.abs(p2y-p1y);
        roundRectPath(c, x, y, ww, hh, Math.min(4, Math.min(ww,hh)/4));

      } else {

  // ---- Local persistence -----------------------------------------------------
  // Everything lives in one browser-local save file (grids/walls/dims all
  // reference each other across boxes, so there's no meaningful way to save
  // "just this product" — Save always commits the whole current drawing).
  // Deletes persist immediately so a removed item can't come back on reload.
  const STORAGE_KEY = 'draftingSpaceGridsWalls.v1';
  function saveStateToStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        nextId, boxes: state.boxes, gridlines: state.gridlines, walls: state.walls,
        elements: state.elements, dims: state.dims, archived: state.archived,
        elementShapes: state.elementShapes, editorMode: state.editorMode,
      }));
      return true;
    } catch(e) { return false; } // storage unavailable (private mode, disabled, quota) — no-op
  }
  function loadStateFromStorage(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.boxes) state.boxes = data.boxes;
      if (data.gridlines) state.gridlines = data.gridlines;
      if (data.walls) state.walls = data.walls;
      if (data.elements) state.elements = data.elements;
      if (data.dims) state.dims = data.dims;
      if (data.archived) state.archived = data.archived;
      if (data.elementShapes) state.elementShapes = data.elementShapes;
      if (typeof data.editorMode === 'string') state.editorMode = data.editorMode;
      if (typeof data.nextId === 'number') nextId = data.nextId;
    } catch(e) { /* corrupt or unavailable — start blank */ }
  }
  // Brief "Saved" confirmation on a button after a successful/failed save.

  const ICON_SVG = {
    save: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2.6v7.2M5.2 7.2L8 10l2.8-2.8"/><path d="M2.8 12.4h10.4"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.8 4.4h10.4M6.2 4.4V2.8h3.6v1.6M4.2 4.4l.7 8.8h6.2l.7-8.8"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>',
  };
  function flashSaveResult(btn, ok){

  }
  function makeActionsRow(onDelete){
    const actions=document.createElement('div'); actions.className='actions';
    const saveBtn=document.createElement('button'); saveBtn.type='button'; saveBtn.className='save'; saveBtn.title='Save'; saveBtn.innerHTML=ICON_SVG.save;
    saveBtn.addEventListener('click', e=>{ e.stopPropagation(); flashSaveResult(saveBtn, saveStateToStorage()); });

  // Products/Unit Plans/Layouts always show, named inline in the tray. New

  function ensureBoxNames(){
    const n = { product:0, unitplan:0, layout:0, element:0 };
    for (const b of state.boxes) {
      if (!(b.kind in n) || b.isInstance) continue; // instances aren't listed, so don't consume a number
      n[b.kind]++;

  // Delete a live Product/Unit Plan/Layout boundary from the Library — this

  function deleteBoundary(id){

  // One card, for either a live box or an archived entry — used for both a

  function buildLibraryItem(kind, entry, onCardClick, hasBranches){

    const cv2=document.createElement('canvas'); cv2.width=150; cv2.height=150; item.appendChild(cv2);
    if (hasBranches) { const star=document.createElement('span'); star.className='branch-star'; star.textContent='★'; star.title='Has branches'; item.appendChild(star); }
    const nm=document.createElement('div'); nm.className='nm';

    inp.addEventListener('input', ()=>{ obj.name=inp.value; });
    nm.appendChild(inp);
    const dims=document.createElement('div'); dims.className='dims'; dims.textContent=tileSizeLabel(entry);
    nm.appendChild(dims);
    item.appendChild(nm);
    item.appendChild(makeActionsRow(()=> live ? deleteBoundary(obj.id) : deleteArchivedMaster(obj.id)));
    item.addEventListener('click', e=>{
      if(e.target===inp||e.target.closest('.actions'))return;
      if (live) { state.selection={kind:'box',id:obj.id}; draw(); }
      if (onCardClick) onCardClick();
    });
    if (live) drawLiveThumb(cv2, obj); else drawSnapshotThumb(cv2, obj.snapshot);
    return item;
  }
  // Group every live box + archived entry of a kind into families: a root
  // (never branched — rootId is null, or its own rootId points nowhere
  // resolvable) plus every branch descended from it, however many
  // generations of "branch of a branch" removed — branches always store the
  // very first original's id, so this is a flat one-level grouping, never a
  // deeper tree.
  // `parentId`, when given (including explicitly null for "standalone/top-
  // level only"), restricts which FAMILIES show up to ones whose ROOT lives
  // there, and ALSO which of the family's BRANCHES are visible: a live
  // branch nested somewhere else (a different parentId — almost always a
  // branch made inside some other Product) stays invisible here until its
  // Product is Pushed, exactly like a fresh unpushed branch is invisible to
  // every OTHER editor. An archived entry always passes (it never recorded a
  // parent) and a branch living at this SAME parentId (made without ever
  // leaving this level) always passes too.
  // `extraBranchParentIds` widens ONLY the branch check, never the root
  // check — used by the Insert panel: a branch made by inserting-then-
  // branching a standalone master directly into the currently open Product
  // is nested (parentId = that Product), not standalone, but it's still
  // fair game to insert again from anywhere else in that SAME Product.
  // Omit `parentId` entirely to see every family/branch regardless of
  // parent — used only once a specific root's id is already known AND the
  // list that found it already vetted its branches (so re-deriving here
  // isn't re-hiding anything the list wouldn't have shown a star for).
  function buildLibraryGroups(kind, parentId, extraBranchParentIds){
    const byId = new Map();
    for (const b of state.boxes) if (b.kind===kind && !b.isInstance) byId.set(b.id, {live:true, obj:b});
    for (const a of state.archived) if (a.kind===kind) byId.set(a.id, {live:false, obj:a});
    const groups = new Map(); // rootId -> {root, branches:[]}
    const groupFor = id => { let g=groups.get(id); if(!g){ g={root:null, branches:[]}; groups.set(id,g);} return g; };
    for (const entry of byId.values()) {
      const rid = entry.obj.rootId;
      if (rid==null || !byId.has(rid)) groupFor(entry.obj.id).root = entry; // no root, or a dangling one — stands alone
      else groupFor(rid).branches.push(entry);
    }
    let list = [...groups.values()].filter(g=>g.root);
    if (parentId !== undefined) {
      list = list.filter(g => !g.root.live || g.root.obj.parentId === parentId);
      const allowed = new Set([parentId, ...(extraBranchParentIds||[])]);
      for (const g of list) g.branches = g.branches.filter(e => !e.live || allowed.has(e.obj.parentId));
    }
    list.sort((a,b)=>{
      const ao=a.root.live&&a.root.obj.open, bo=b.root.live&&b.root.obj.open;
      if (ao!==bo) return ao?-1:1;
      return (a.root.obj.name||'').localeCompare(b.root.obj.name||'');
    });
    for (const g of list) g.branches.sort((x,y)=>(x.obj.name||'').localeCompare(y.obj.name||''));
    return list;
  }
  // Clicking a root opens (or, clicking it again, closes) the Branches tray
  // for it, and the root's own card stays blue the whole time it's showing
  // — so it's always clear which original the tray to the right belongs to.
  function selectBranchRoot(kind, id){
    if (state.branchRootId===id) { state.branchRootId=null; state.branchRootKind=null; }
    else { state.branchRootId=id; state.branchRootKind=kind; }
    refreshTray();
  }
  // The parentId that "belongs here" for whichever kind's Library section is
  // currently relevant: null at the top level (nothing open, or a
  // standalone file of that kind is open — either way, siblings are every
  // other top-level file of the kind) or the open container's own id when
  // browsing what's nested inside it (e.g. Unit Plans inside an open
  // Product). Products are always top-level, so this is always null there.
  function currentLibraryParentId(){
    const active = activeContainer();
    return active ? active.parentId : null;
  }
  // Render one kind's whole tray: one card per family's root — its branches
  // (if any) live in the separate Branches tray, opened by clicking it.
  // Products are the exception: they never branch, so clicking one instead
  // opens it straight on the drafting canvas, and it never shows the
  // Branches tray or the persistent blue "selected" highlight.
  function buildKindList(kind, listEl){
    const parentId = currentLibraryParentId();
    const groups = buildLibraryGroups(kind, parentId);
    listEl.innerHTML='';
    if (parentId==null) {
      const add=document.createElement('div'); add.className='item add-new'; add.textContent='+';
      add.title='New '+KIND_LABEL[kind];
      add.addEventListener('click', ()=>createNewRoot(kind));
      listEl.appendChild(add);
    }
    // A standalone file (parentId null — this IS the top-level, isolated-
    // canvas context for this kind) has no other way to be opened: unlike a
    // Unit Plan/Layout nested inside a Product, which you reach by opening
    // it right there on the canvas, there's nothing else visible to open it
    // from. So here, like a Product, clicking opens it — the Branches tray
    // (if it has any) shows alongside, rather than instead of, opening it.
    const standalone = parentId==null;
    for (const g of groups) {
      const hasBranches = kind!=='product' && g.branches.length>0;
      const onClick = kind==='product'
        ? (g.root.live ? ()=>{ openWithAncestors(g.root.obj); centerViewOnBox(g.root.obj, 10); draw(); } : null)
        : (standalone && g.root.live)
          ? ()=>{
              openWithAncestors(g.root.obj);
              centerViewOnBox(g.root.obj, NEW_ROOT_SIZE[kind].margin);
              if (hasBranches) { state.branchRootId=g.root.obj.id; state.branchRootKind=kind; refreshBranchesTray(); }
              draw();
            }
          : (hasBranches ? ()=>selectBranchRoot(kind, g.root.obj.id) : null);
      const card = buildLibraryItem(kind, g.root, onClick, hasBranches);
      if (hasBranches && state.branchRootId===g.root.obj.id) card.classList.add('lib-selected');
      listEl.appendChild(card);
    }
    // Pushed branches from every Product, waiting for review — only shown
    // here, in the standalone Unit Plan/Layout Editor's own top-level list
    // (Products never push anything, and this isn't shown while browsing
    // nested inside an open Product).
    if (standalone && (kind==='unitplan' || kind==='layout')) {
      for (const g of buildPushedGroups(kind)) {
        const header=document.createElement('div'); header.className='pushed-group-header'; header.textContent=g.name;
        listEl.appendChild(header);
        for (const box of g.items) listEl.appendChild(buildPushedCard(kind, box));
      }
    }
  }
  const productsListEl=document.getElementById('productsList');
  function buildProductsList(){ buildKindList('product', productsListEl); }
  const unitplansListEl=document.getElementById('unitplansList');
  function buildUnitplansList(){ buildKindList('unitplan', unitplansListEl); }
  const layoutsListEl=document.getElementById('layoutsList');
  function buildLayoutsList(){ buildKindList('layout', layoutsListEl); }
  const elementsListEl=document.getElementById('elementsList');
  function buildElementsList(){ buildKindList('element', elementsListEl); }
  // The second tray to the right of the Library, showing whichever root's
  // branches were last clicked — stays open (even empty) until you close it
  // or click another root, and hides itself if the Library isn't showing.
  const branchesTrayEl=document.getElementById('branchesTray');
  const branchesTitleTextEl=document.getElementById('branchesTitleText');
  const branchesListEl=document.getElementById('branchesList');
  function refreshBranchesTray(){
    if (state.branchRootId==null || trayEl.hidden) { branchesTrayEl.hidden=true; return; }
    const g = buildLibraryGroups(state.branchRootKind).find(g=>g.root.obj.id===state.branchRootId);
    if (!g) { state.branchRootId=null; state.branchRootKind=null; branchesTrayEl.hidden=true; return; }
    branchesTrayEl.hidden=false;
    branchesTitleTextEl.textContent = 'Branches: ' + (g.root.obj.name || KIND_LABEL[state.branchRootKind]);
    branchesListEl.innerHTML='';
    if (!g.branches.length) {
      const note=document.createElement('div'); note.className='empty-note'; note.textContent='No branches yet.';
      branchesListEl.appendChild(note);
    } else {
      for (const br of g.branches) branchesListEl.appendChild(buildLibraryItem(state.branchRootKind, br));
    }
  }
  document.getElementById('closeBranchesBtn').addEventListener('click', e=>{
    e.stopPropagation();
    state.branchRootId=null; state.branchRootKind=null;
    refreshTray(); // also clears the root card's blue highlight, not just the tray
  });
  // Only the section matching what you currently have open is shown — the
  // rest hide, so the Library always tracks the level you're working at.
  function updateTrayVisibility(){
    const kind = (activeContainer()||{}).kind || state.editorMode;
    productsListEl.hidden = kind!=='product';
    unitplansListEl.hidden = kind!=='unitplan';
    layoutsListEl.hidden = kind!=='layout';
    elementsListEl.hidden = kind!=='element';
  }
  function refreshTray(){
    ensureBoxNames();
    buildProductsList(); buildUnitplansList(); buildLayoutsList(); buildElementsList();
    updateTrayVisibility();
    buildInsertList();
    refreshBranchesTray();
  }

  function hideBoxMenu(){ menuEl.style.display='none'; }
  function showBoxMenu(x, y, boxId){
    const bx = findById(state.boxes, boxId);
    if (!bx) return;
    // you can only close the container you're working in — not one with an open
    // child still inside it (close the inner one first)
    const lockedOpen = bx.open && boxHasOpenDescendant(bx);
    // Closing a placed instance (masterId set) asks which way to save: push
    // the edit to main, or split it off as its own branch. Closing something
    // that merely HAS instances (but isn't one itself — e.g. reopening the
    // original) only offers to push to main, since there's nothing to branch
    // without duplicating a box that already has its own canvas position.
    // Anything with no lineage at all is just a plain close. Products never
    // get a branch option at all — they only ever save to main.
    const canBranch = bx.kind!=='product';
    const saveToMainItem = { label:'Close and save to main', sc:'', disabled:lockedOpen, act:()=>{ saveToMain(bx.id); closeBoundary(bx); } };
    // Only a nested Unit Plan/Layout gets a cancel snapshot when it opens
    // (openWithAncestors) — so this item only ever appears for those.
    const cancelItem = { label:'Close and cancel', sc:'', danger:true, disabled:lockedOpen,
      title:"Discards every change made since this was opened — walls, grids, elements, dims, and anything nested inside it",
      act:()=>closeAndCancel(bx) };
    const closeItems = !bx.open
      ? [{ label:'Open', sc:'', disabled:lockedOpen || !canOpenBox(bx),
           title: canOpenBox(bx) ? '' : "Placed in a Unit Plan Editor file — can't be opened, only moved or deleted",
           act:()=>openWithAncestors(bx) }]
      : bx.masterId!=null
        ? (canBranch
            ? [ saveToMainItem, { label:'Close and create branch', sc:'', disabled:lockedOpen, act:()=>{ saveAsBranch(bx.id); closeBoundary(bx); } } ]
            : [ saveToMainItem, { label:'Close', sc:'', disabled:lockedOpen, act:()=>closeBoundary(bx) } ])
        : hasLiveInstances(bx.id)
          ? [ saveToMainItem, { label:'Close', sc:'', disabled:lockedOpen, act:()=>closeBoundary(bx) } ]
          : [{ label:'Close', sc:'', disabled:lockedOpen, act:()=>closeBoundary(bx) }];
    if (bx.open && state.cancelSnapshots[bx.id]) closeItems.push(cancelItem);
    const items = [
      ...closeItems,
      { label: 'Copy', sc:'Ctrl+C', act:()=>copyBox(boxId) },
      { label: 'Paste', sc:'Ctrl+V', act:()=>pasteClipboard(s2w({x,y})), disabled:!clipboard },
      { divider:true },
      { label: 'Delete', sc:'Del', danger:true, disabled:isProtectedRoot(boxId),
        title: isProtectedRoot(boxId) ? "The open file itself can't be deleted from the canvas — use Delete in the Library instead" : '',
        act:()=>{ state.multiSelection=[]; state.selection={kind:'box',id:boxId}; deleteSelection(); } },
    ];
    menuEl.innerHTML='';
    for (const it of items){
      if (it.divider){ const d=document.createElement('div'); d.className='divider'; menuEl.appendChild(d); continue; }
      const el=document.createElement('div');
      el.className='item'+(it.danger?' danger':'');
      if (it.disabled){ el.style.opacity=.4; el.style.pointerEvents='none'; }
      if (it.title) el.title = it.title;
      el.innerHTML=`<span>${it.label}</span><span class="sc">${it.sc||''}</span>`;
      el.addEventListener('click', ()=>{ it.act(); hideBoxMenu(); draw(); });
      menuEl.appendChild(el);
    }
    menuEl.style.left=x+'px'; menuEl.style.top=y+'px'; menuEl.style.display='block';
  }
  function showMenu(x, y, items){
    menuEl.innerHTML='';
    for (const it of items){
      if (it.divider){ const d=document.createElement('div'); d.className='divider'; menuEl.appendChild(d); continue; }
      const el=document.createElement('div');
      el.className='item'+(it.danger?' danger':'');
      if (it.disabled){ el.style.opacity=.4; el.style.pointerEvents='none'; }
      el.innerHTML=`<span>${it.label}</span><span class="sc">${it.sc||''}</span>`;
      el.addEventListener('click', ()=>{ it.act(); hideBoxMenu(); draw(); });
      menuEl.appendChild(el);
    }
    menuEl.style.left=x+'px'; menuEl.style.top=y+'px'; menuEl.style.display='block';
  }
  function showElementMenu(x, y, id){
    showMenu(x, y, [
      { label:'Rotate 90°', sc:'R', act:()=>{ const el=findById(state.elements,id); if(el) el.rot=((el.rot||0)+90)%360; } },
      { divider:true },
      { label:'Delete', sc:'Del', danger:true, act:()=>{ state.multiSelection=[]; state.selection={kind:'element',id}; deleteSelection(); } },
    ]);
  }
  stage.addEventListener('contextmenu', e=>{
    e.preventDefault();
    const sp=getScreen(e); const wp=s2w(sp);
    panning=null; stage.style.cursor=''; updateCursor();
    // prefer the currently highlighted (hovered/Tab-cycled) container
    refreshHover(sp);
    const ht = hoverTarget();
    if (ht && ht.kind==='box') {
      state.selection={kind:'box',id:ht.id}; draw();
      showBoxMenu(sp.x, sp.y, ht.id); return;
    }
    if (ht && ht.kind==='element') {
      state.selection=ht; draw();
      showElementMenu(sp.x, sp.y, ht.id); return;
    }
    const elHit = hitTest(wp);
    if (elHit && elHit.kind==='element'){
      state.selection=elHit; draw();
      showElementMenu(sp.x, sp.y, elHit.id);
      return;
    }
    const bx=boxContaining(wp, {interactableOnly:true});
    if (bx){
      state.selection={kind:'box',id:bx.id}; draw();
      showBoxMenu(sp.x, sp.y, bx.id);
    } else hideBoxMenu();
  });
  window.addEventListener('mousedown', e=>{ if(!menuEl.contains(e.target)) hideBoxMenu(); }, true);

  // ---- Copy / paste ---------------------------------------------------------
  let clipboard = null;
  // Collect a box together with its descendant boxes and the grid lines bound to them.
  function collectSubtree(rootId){
    const boxes=[], grids=[];
    const visit=(id)=>{
      const b=findById(state.boxes,id); if(!b)return;
      // bake current effective extent so the clone is positioned correctly even
      // if a binding falls outside the copied subtree
      const e=boxExt(b);
      boxes.push({ ...JSON.parse(JSON.stringify(b)), x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2 });
      state.gridlines.filter(g=>g.boxId===id).forEach(g=>grids.push(JSON.parse(JSON.stringify(g))));
      state.boxes.filter(c=>c.parentId===id).forEach(c=>visit(c.id));
    };
    visit(rootId);
    return { boxes, grids };
  }
  function copyBox(id){ clipboard = collectSubtree(id); }
  function pasteClipboard(at){
    if (!clipboard) return;
    const data = JSON.parse(JSON.stringify(clipboard));
    // offset so the paste lands near the cursor (or +2ft if no point given)
    const root = data.boxes[0];
    const dx = at ? at.x - root.x1 : 2;
    const dy = at ? at.y - root.y1 : 2;
    const idMap = new Map();
    data.boxes.forEach(b=>idMap.set(b.id, uid()));
    data.grids.forEach(g=>idMap.set(g.id, uid()));
    const remap = id => (id!=null && idMap.has(id)) ? idMap.get(id) : null;
    const remapRef = ref => {
      if (!ref) return null;
      if (ref.type==='grid') { const id=remap(ref.id); return id!=null ? {type:'grid',id} : null; }
      if (ref.type==='edge') { const bid=remap(ref.boxId); return bid!=null ? {type:'edge',boxId:bid,edge:ref.edge} : null; }
      return null;
    };
    data.boxes.forEach(b=>{
      b.id=idMap.get(b.id);
      b.parentId=remap(b.parentId);
      b.x1+=dx; b.x2+=dx; b.y1+=dy; b.y2+=dy;
      if (b.bind) for (const k in b.bind) b.bind[k]=remapRef(b.bind[k]);
      b.open=false;
      // a paste is a fresh instance — it hasn't been named/closed here yet
      if (b.kind==='product') b.name=null; else if (b.kind==='unitplan') b.name=null;
    });
    data.grids.forEach(g=>{
      g.id=idMap.get(g.id);
      g.boxId=remap(g.boxId);
      if (g.boxId==null && g.pos!=null) g.pos += (g.type==='v'?dx:dy);
    });
    state.boxes.push(...data.boxes);
    state.gridlines.push(...data.grids);
    relabelGrid();
    state.selection={kind:'box', id:data.boxes[0].id};
    refreshTray();
    draw();
  }

  // ---- Insert (copy an existing Unit Plan/Layout in via 4 picked grids) -----
  // Like collectSubtree, but also pulls in the walls/elements that belong to
  // the subtree (by containerId, falling back to geometric containment for
  // untagged/legacy entries) and bakes them to plain coordinates — grids/
  // boxes stay reference-based (fraction of their box) so rescaling them
  // later is just moving the box, no per-grid math needed.
  function collectSubtreeFull(rootId){
    const { boxes, grids } = collectSubtree(rootId);
    const boxIds = new Set(boxes.map(b=>b.id));
    // Ownership is strict (no positional fallback) — an untagged wall/
    // element/dim has no known owner and isn't included, same rule
    // drawLiveThumb uses.
    const owns = containerId => containerId!=null && boxIds.has(containerId);
    // Deep-clone walls/elements as-is (keeping their xRef/yRef intact) so
    // insertSubtreeAt can remap the anchoring itself instead of losing it —
    // a wall/element with no ref never had one, and stays that way; one
    // that was anchored to a grid/edge should still be anchored, not just
    // baked to a fixed point that drifts still when its host resizes.
    const walls = state.walls.filter(wl=>owns(wl.containerId)).map(wl=>JSON.parse(JSON.stringify(wl)));
    const elements = state.elements.filter(el=>owns(el.containerId)).map(el=>JSON.parse(JSON.stringify(el)));
    const dims = state.dims.filter(d=>owns(d.containerId)).map(d=>JSON.parse(JSON.stringify(d)));
    // An Element's own authored shapes — owned the same way (by elementId,
    // which is just its containerId equivalent). Its insertionPoint rides
    // along for free: it's a plain field on the box itself, already part of
    // the deep-cloned `boxes` above.
    const shapes = state.elementShapes.filter(sh=>owns(sh.elementId)).map(sh=>JSON.parse(JSON.stringify(sh)));
    return { boxes, grids, walls, elements, dims, shapes };
  }
  // Begin picking 4 reference edges to place a copy of `id` (a Unit Plan or
  // Layout living anywhere in the document) into the currently open container.
  function startInsert(id){
    state.inserting = { sourceId:id, picks:[] };
    setTool('select');
    buildInsertList();
    draw();
  }
  function tryFinalizeInsert(){
    const vert=state.inserting.picks.filter(p=>p.axis==='h'); // vertical edges → x
    const horz=state.inserting.picks.filter(p=>p.axis==='v'); // horizontal edges → y
    if (vert.length>=2 && horz.length>=2) {
      const vs=[...vert].sort((a,b)=>a.coord-b.coord), hs=[...horz].sort((a,b)=>a.coord-b.coord);
      insertSubtreeAt(state.inserting.sourceId,
        { x1:vs[0].ref, x2:vs[vs.length-1].ref, y1:hs[0].ref, y2:hs[hs.length-1].ref });
      state.inserting=null;
      buildInsertList();
    }
  }
  // Clone the source box's subtree, rescaled from its own footprint to fit
  // exactly between the 4 picked references, and drop it into the currently
  // open container — a fresh, independent instance (edits to it never touch
  // the original, or any other instance placed elsewhere).
  // `opts.existingRootId`, when given, replaces that box's own contents in
  // place (used to sync a master's canonical content into an instance, or an
  // edited instance's content back into its master) instead of inserting a
  // brand-new box — `refs` is ignored and the target rect is the existing
  // box's own current extent, and its identity fields (parentId/bind/open/
  // isInstance/masterId/name) are preserved rather than reset.
  // `opts.silent` skips the per-call selection/refresh/save/draw so a batch
  // of calls (propagating to every sibling instance) can do that once at the end.
  function insertSubtreeAt(sourceId, refs, opts){
    opts = opts || {};
    const existingBox = opts.existingRootId ? findById(state.boxes, opts.existingRootId) : null;
    let tX1,tX2,tY1,tY2;
    if (existingBox) {
      const e = boxExt(existingBox);
      tX1=e.x1; tX2=e.x2; tY1=e.y1; tY2=e.y2;
    } else {
      const x1=resolveRef(refs.x1), x2=resolveRef(refs.x2), y1=resolveRef(refs.y1), y2=resolveRef(refs.y2);
      if (x1==null||x2==null||y1==null||y2==null) return;
      tX1=Math.min(x1,x2); tX2=Math.max(x1,x2); tY1=Math.min(y1,y2); tY2=Math.max(y1,y2);
    }
    const tW=tX2-tX1, tH=tY2-tY1;
    if (tW<0.1 || tH<0.1) return;

    // The source can be a live box, or an archived (deleted-from-canvas)
    // master — in which case its subtree was already captured at delete time.
    const archivedEntry = findById(state.archived, sourceId);
    const src = archivedEntry ? archivedEntry.snapshot : collectSubtreeFull(sourceId);
    const data = JSON.parse(JSON.stringify(src));
    const rootOrig = data.boxes[0];
    const origRootId = rootOrig.id; // copy by value — rootOrig.id gets overwritten below
    const oX1=rootOrig.x1, oY1=rootOrig.y1, oW=(rootOrig.x2-rootOrig.x1)||1, oH=(rootOrig.y2-rootOrig.y1)||1;
    const fx = x => tX1 + ((x-oX1)/oW)*tW, fy = y => tY1 + ((y-oY1)/oH)*tH;

    // Replacing an existing box's contents: clear out what it currently owns
    // (descendant boxes, their grids, and everything's walls/elements/dims)
    // before the fresh remapped copy goes in — the box itself (its own row
    // in state.boxes) stays, only its insides are swapped out.
    if (existingBox) {
      bakeAllWallCoords();
      const oldChildIds = new Set(collectSubtree(existingBox.id).boxes.map(b=>b.id).filter(id=>id!==existingBox.id));
      const ownedIds = new Set([existingBox.id, ...oldChildIds]);
      const oldGridIds = new Set(state.gridlines.filter(g=>ownedIds.has(g.boxId)).map(g=>g.id));
      clearRefsTo(oldChildIds, oldGridIds);
      state.boxes = state.boxes.filter(b=>!oldChildIds.has(b.id));
      state.gridlines = state.gridlines.filter(g=>!oldGridIds.has(g.id));
      state.walls = state.walls.filter(w=>!ownedIds.has(w.containerId));
      state.elements = state.elements.filter(el=>!ownedIds.has(el.containerId));
      state.dims = state.dims.filter(d=>!ownedIds.has(d.containerId));
      state.elementShapes = state.elementShapes.filter(sh=>!ownedIds.has(sh.elementId));
    }

    const idMap = new Map();
    data.boxes.forEach(b=>idMap.set(b.id, (existingBox && b.id===origRootId) ? existingBox.id : uid()));
    data.grids.forEach(g=>idMap.set(g.id, uid()));

    centerViewOnBox(bx, margin);
    saveStateToStorage();
    draw();
  }
  // Open a boundary and all its ancestors, so the full nesting chain is active
  // (you then close them from the inside out).
  // Opening/closing a boundary changes which Library section is visible and
  // which item sorts to the top, so both refresh the tray.
  // Every top-level boundary (Product, or a standalone Unit Plan, Layout,
  // Element) is its own isolated "file" — opening anything closes every
  // OTHER top-level box first, regardless of kind, so at most one is ever
  // open at a time and nothing from a different file stays visible
  // underneath it.
  function openWithAncestors(bx){
    // A nested Unit Plan/Layout (Product Editor's own flow) gets a snapshot
    // the moment it opens, so "Close and Cancel" has something to revert to.
    // Skipped if it's already open (re-opening something already active isn't
    // a fresh "session" to snapshot) or top-level (nothing to cancel back to
    // — a standalone file's own Library entry already holds its last save).
    if (!bx.open && bx.parentId!=null && (bx.kind==='unitplan'||bx.kind==='layout')) {
      state.cancelSnapshots[bx.id] = collectSubtreeFull(bx.id);
    }
    let root = bx;
    while (root.parentId != null) { const p = findById(state.boxes, root.parentId); if (!p) break; root = p; }
    for (const p of state.boxes) if (p.parentId==null && p.id!==root.id) closeSubtree(p.id);
    bx.open = true;
    let p = bx.parentId;
    while (p != null) { const pb = findById(state.boxes, p); if (!pb) break; pb.open = true; p = pb.parentId; }

  function closeBoundary(bx){

    refreshTray();
  }
  // Throw away every edit made inside `bx` since it was opened (walls, grids,
  // elements, dims, its own authored shapes, and any nested boxes drawn/
  // deleted/moved along the way — restoring the snapshot wholesale discards
  // all of it), then close it. Note: if something inside was individually
  // deleted (and so archived) during the session, that archived copy is not
  // un-archived by a cancel here — a rare, harmless leftover in the Library,
  // not a crash risk.
  function closeAndCancel(bx){
    const snap = state.cancelSnapshots[bx.id];
    if (!snap) { closeBoundary(bx); return; }
    const oldIds = subtreeIds(bx.id);
    state.boxes = state.boxes.filter(b=>!oldIds.has(b.id)).concat(snap.boxes);
    state.gridlines = state.gridlines.filter(g=>!oldIds.has(g.boxId)).concat(snap.grids);
    state.walls = state.walls.filter(w=>!oldIds.has(w.containerId)).concat(snap.walls);
    state.elements = state.elements.filter(el=>!oldIds.has(el.containerId)).concat(snap.elements);
    state.dims = state.dims.filter(d=>!oldIds.has(d.containerId)).concat(snap.dims);

  // — only then does closing it need to ask which way to save.
  function hasLiveInstances(id){ return state.boxes.some(b=>b.masterId===id); }
  // The nearest ancestor Product's name (or null if there isn't one — a

  function nearestProductName(box){

  }
  // The nearest ancestor Product box itself (or null if there isn't one).
  function nearestProduct(box){
    let p = box.parentId!=null ? findById(state.boxes, box.parentId) : null;

  }
  // The family's original, un-branched root — live or archived — that `box`

  // one hop: branching off a branch still resolves straight to the very
  // first original, never to the intermediate branch.
  function familyRoot(box){
    if (box.masterId==null) return null;
    const m = findById(state.boxes, box.masterId) || findById(state.archived, box.masterId);
    if (!m) return null; // master fully gone — this branch becomes its own root
    const rid = m.rootId!=null ? m.rootId : m.id;

    return obj ? { id:rid, obj } : null;
  }
  // "Close and save to main": push this box's current (just-edited) content
  // up into the master it belongs to (whether that's itself already, a live
  // box elsewhere, or an archived Library entry), then push that same
  // canonical content back out to every other live instance sharing that
  // master, so they all end up identical to what you just edited.
  function saveToMain(boxId){
    const box = findById(state.boxes, boxId);
    if (!box) return;
    const masterId = box.masterId!=null ? box.masterId : box.id;
    if (masterId !== box.id) {
      const masterLive = findById(state.boxes, masterId);
      if (masterLive) {
        insertSubtreeAt(box.id, null, { existingRootId: masterId, silent:true });
      } else {
        const archivedEntry = findById(state.archived, masterId);
        if (archivedEntry) archivedEntry.snapshot = collectSubtreeFull(box.id);
      }
    }
    for (const other of state.boxes.filter(b=>b.masterId===masterId && b.id!==box.id)) {

    }
    refreshTray();
    saveStateToStorage();
  }
  // "Close and create branch": detach this specific placement from its
  // lineage — it keeps the edits you just made and becomes its own Library
  // entry going forward, named "<original name>_<n>_<product it's in>" where
  // <n> is the next branch number for the WHOLE family (shared with, and
  // incremented by, every other branch ever made from this same original —
  // stored on the original itself so numbering never restarts partway
  // through a chain of branches-of-branches). It's filed in the Library
  // under that original, never under the branch it happened to come from.
  function saveAsBranch(boxId){
    const box = findById(state.boxes, boxId);
    if (!box || box.kind==='product') return; // Products only ever save to main, never branch
    const root = familyRoot(box);
    const rootId = root ? root.id : box.id;
    const rootObj = root ? root.obj : box;
    rootObj.branchCount = (rootObj.branchCount || 1) + 1;
    const baseName = rootObj.name || KIND_LABEL[box.kind];
    const prodName = nearestProductName(box);
    box.name = prodName ? `${baseName}_${rootObj.branchCount}_${prodName}` : `${baseName}_${rootObj.branchCount}`;

  function pushBranches(){

    saveStateToStorage();
  }
  // "Approve" (from the Unit Plan/Layout Editor's pushed-branches review):

  // otherwise dangle once its old parent is out of the picture), no longer

  // and immediately insertable anywhere a Unit Plan/Layout is insertable —

  function approveBranch(boxId){

    box.branchCount = undefined;

    refreshTray();
    saveStateToStorage();
    draw();
  }
  // "Delete" (from the same review list): just un-pushes it — it drops out

  function rejectPushedBranch(boxId){

  // Every pushed branch of `kind`, grouped by which Product it came from —

  function buildPushedCard(kind, box){

  }
  // Boundary drawing (Unit Plan/Layout) and element placement no longer
  // have their own toolbar buttons — everything nested gets PLACED via the
  // Insert panel instead (an existing Unit Plan/Layout/Element, made in its

  function updateToolAvailability(){

    stage.style.cursor = state.tool==='select' ? 'default' : 'crosshair';

  function updateTip(){ /* instructions bubble removed */ }

  document.getElementById('showProductDims').addEventListener('change', e=>{ state.showDims.product=e.target.checked; draw(); });
  document.getElementById('showUnitplanDims').addEventListener('change', e=>{ state.showDims.unitplan=e.target.checked; draw(); });
  document.getElementById('showLayoutDims').addEventListener('change', e=>{ state.showDims.layout=e.target.checked; draw(); });

  const elementEditorToolsetEl = document.getElementById('elementEditorToolset');
  const pushBranchesBtn = document.getElementById('pushBranchesBtn');
  pushBranchesBtn.addEventListener('click', pushBranches);
  function updateToolsetVisibility(){

  const MODE_LABEL = { product:'Product Editor', unitplan:'Unit Plan Editor', layout:'Layout Editor', element:'Element Editor' };
  const MODE_MARK_SVG = {
    product: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 2h6.5A2.5 2.5 0 0 1 11 4.5v15A2.5 2.5 0 0 1 8.5 22H2Z"/><path d="M22 2h-6.5A2.5 2.5 0 0 0 13 4.5v15A2.5 2.5 0 0 0 15.5 22H22Z"/></svg>',
    unitplan: '<svg viewBox="0 0 46.78 46.78" fill="none" stroke="currentColor" stroke-width="3"><rect x="4" y="4" width="38.78" height="38.78" rx="4.9"/><path d="M4 23.39h38.78"/></svg>',
    layout: '<svg viewBox="0 0 46.78 46.78" fill="none" stroke="currentColor" stroke-width="3"><rect x="4" y="4" width="38.78" height="38.78" rx="5.11"/><circle cx="23.39" cy="23.39" r="6.996"/></svg>',
    element: '<svg viewBox="0 0 46.78 46.78" fill="none" stroke="currentColor" stroke-width="3"><circle cx="23.39" cy="23.39" r="19.39"/></svg>',
  };
  const modeBtnEl = document.getElementById('modeBtn');
  const modeBtnMarkEl = document.getElementById('modeBtnMark');
  const modeBtnLabelEl = document.getElementById('modeBtnLabel');

  for (const opt of modeMenuEl.querySelectorAll('.opt')) {

  function closeModeMenu(){ modeMenuEl.hidden = true; modeBtnEl.classList.remove('open'); }

  function updateModeSwitcher(){

    modeBtnLabelEl.textContent = MODE_LABEL[state.editorMode];

  }
  function setEditorMode(mode){

    updateModeSwitcher();

    saveStateToStorage();

  // Freeze every wall endpoint at its current resolved position. Call before
  // removing grids/boxes so anchored walls stay put instead of jumping back.
  function bakeAllWallCoords(){
    state.walls.forEach(wl=>{ for(const ep of [wl.a,wl.b]){ const p=endPos(ep); ep.x=p.x; ep.y=p.y; } });
    state.elements.forEach(el=>{ const p=endPos(el.ref); el.ref.x=p.x; el.ref.y=p.y; });
  }
  // Drop bindings/refs pointing at removed features. Wall endpoints revert to a
  // free coord; dimensions drop dead references and are removed if <2 remain.
  function clearRefsTo(boxIds, gridIds){
    const dead = ref => ref && ((ref.type==='grid'&&gridIds.has(ref.id)) || (ref.type==='edge'&&boxIds.has(ref.boxId)));
    state.boxes.forEach(b=>{ if(b.bind) for(const k in b.bind){ if(dead(b.bind[k])) b.bind[k]=null; } });
    state.walls.forEach(wl=>{ for(const ep of [wl.a,wl.b]){ if(dead(ep.xRef)) ep.xRef=null; if(dead(ep.yRef)) ep.yRef=null; } });
    state.elements.forEach(el=>{ if(dead(el.ref.xRef)) el.ref.xRef=null; if(dead(el.ref.yRef)) el.ref.yRef=null; });

    // the whole dim if any reference died; plain dims just lose the dead refs.
    state.dims = state.dims.filter(d => !((d.locked||d.eq||d.flex) && d.refs.some(dead)));

  }

  }

  function fitView(){
    // gather all points belonging to the currently open Product only — the
    // canvas never fits to (or reveals) another Product's content
    const visible = visibleBoxIds();
    const pts=[];
    state.walls.forEach(w=>{ if(visible.has(w.containerId)) pts.push(endPos(w.a),endPos(w.b)); });
    state.dims.forEach(d=>{ if(!visible.has(d.containerId)) return; const ep=dimLineEndpoints(d); if(ep)pts.push(ep[0],ep[1]); });
    state.gridlines.forEach(g=>{ if(!visible.has(g.boxId)) return; const gp=gridPos(g); if(g.type==='v')pts.push({x:gp,y:0}); else pts.push({x:0,y:gp}); });
    state.boxes.forEach(b=>{ if(!visible.has(b.id)) return; const e=boxExt(b); pts.push({x:e.x1,y:e.y1},{x:e.x2,y:e.y2}); });

    if(pts.length===0){

    pts.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});

    minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
    const wW=maxX-minX, wH=maxY-minY;
    const sx=cv.clientWidth/(wW*PPF), sy=cv.clientHeight/(wH*PPF);
    state.view.scale=Math.max(0.15,Math.min(12,Math.min(sx,sy)));
    state.view.x = cv.clientWidth/2 - ((minX+maxX)/2)*ppfNow();
    state.view.y = cv.clientHeight/2 - ((minY+maxY)/2)*ppfNow();
    draw();
  }

  // ---- Keyboard -------------------------------------------------------------
  let spaceDown=false;
  let shiftDown=false;
  window.addEventListener('keydown', e=>{
    if(e.key==='Shift' && !shiftDown){ shiftDown=true; if(state.tool==='grid')draw(); }
    if(e.target.tagName==='INPUT')return;
    // Tab cycles the highlight through overlapping containers (then grids) under
    // the cursor — never moves focus to the toolbar buttons.
    if(e.key==='Tab'){ e.preventDefault(); if(hoverList.length>1){ hoverIdx=(hoverIdx+1)%hoverList.length; draw(); } return; }
    // copy / paste a bounding box (with its grids & child boxes)
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){
      if(state.selection && state.selection.kind==='box'){ copyBox(state.selection.id); }
      return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){
      pasteClipboard(state.snap ? snapWorld(mouseWRaw) : mouseWRaw); e.preventDefault(); return;
    }
    if(e.key==='Enter'){ if(dimBuild) commitDim(); return; }
    if(e.code==='Space'){spaceDown=true; stage.style.cursor='grab'; e.preventDefault(); return;}
    const k=e.key.toLowerCase();
    if(k==='r' && state.selection && state.selection.kind==='element'){
      const el=findById(state.elements,state.selection.id); if(el){ el.rot=((el.rot||0)+90)%360; draw(); } return;
    }
    if(k==='v')setTool('select');
    else if(k==='u')setTool('unitplan');
    else if(k==='y')setTool('layout');
    else if(k==='n')setTool('element:toilet');
    else if(k==='g')setTool('grid');
    else if(k==='w'||k==='6')setTool('wall6');
    else if(k==='7')setTool('wall12');
    else if(k==='d')setTool('dim');
    else if(k==='l')setTool('lockdim');
    else if(k==='e')setTool('eqdim');
    else if(k==='f')setTool('flexdim');
    else if(e.key==='Delete'||e.key==='Backspace')deleteSelection();
    else if(e.key==='Escape'){drag=null;dimBuild=null;state.inserting=null;state.selection=null;state.multiSelection=[];buildInsertList();draw();}
    else if(e.key==='Home')fitView();
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='Space'){spaceDown=false; updateCursor();}
    if(e.key==='Shift'){ shiftDown=false; if(state.tool==='grid')draw(); }
  });

  // ---- Boot -----------------------------------------------------------------
  function seed(){
    state.view={x:80,y:70,scale:1};
    loadStateFromStorage(); // restore whatever was last explicitly saved, if anything
  }
  seed();
  updateModeSwitcher();
  updateToolsetVisibility();
  refreshTray();
  resize();
  setTool('select');
  fitView();
})();
</script>
</body>
</html>
