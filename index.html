  // Render a live preview of a Product/Unit Plan/Layout boundary's actual current
  // contents (nested boundaries, grids, walls, elements) into a small canvas,
  // read straight from live state.
  function drawLiveThumb(canvas, box){
    const c=canvas.getContext('2d'), cw=canvas.width, ch=canvas.height, pad=8;
    c.clearRect(0,0,cw,ch);
    const e=boxExt(box), W=(e.x2-e.x1)||1, H=(e.y2-e.y1)||1;
    const sc=Math.min((cw-2*pad)/W,(ch-2*pad)/H);
    const ox=(cw-W*sc)/2, oy=(ch-H*sc)/2;
    const SX=wx=>ox+(wx-e.x1)*sc, SY=wy=>oy+(wy-e.y1)*sc;
    c.strokeStyle='#7e879a'; c.lineWidth=1; c.strokeRect(ox,oy,W*sc,H*sc);
    // Scope to this box's own subtree (itself + descendants) by ownership,
    // not just world position — two unit plans/layouts can sit in different
    // products at overlapping coordinates, and a purely positional check
    // would leak an ancestor's (or an unrelated box's) grid lines in.
    const scopeIds = new Set([box.id]);
    for (const b of state.boxes) if (isBoxAncestor(box.id, b)) scopeIds.add(b.id);
    // nested boundaries (e.g. a product's unit plans, a unit plan's layouts)
    c.setLineDash([2,2]);
    for(const d of state.boxes){
      if(d.id===box.id || !scopeIds.has(d.id)) continue;
      const de=boxExt(d);
      c.strokeStyle=boundaryColor(d); c.lineWidth=1;
      c.strokeRect(SX(de.x1), SY(de.y1), (de.x2-de.x1)*sc, (de.y2-de.y1)*sc);
    }
    c.setLineDash([]);
    // grid lines actually bound to this box or one of its descendants
    c.strokeStyle='#7da0d0'; c.setLineDash([3,2]);
    for(const g of state.gridlines){
      if (g.boxId==null || !scopeIds.has(g.boxId)) continue;
      const gp=gridPos(g);
      c.beginPath();
      if(g.type==='v'){ if(gp<e.x1-0.05||gp>e.x2+0.05) continue; const x=SX(gp); c.moveTo(x,SY(e.y1)); c.lineTo(x,SY(e.y2)); }
      else { if(gp<e.y1-0.05||gp>e.y2+0.05) continue; const y=SY(gp); c.moveTo(SX(e.x1),y); c.lineTo(SX(e.x2),y); }
      c.stroke();
    }
    c.setLineDash([]);
    // Walls/elements own no grid-line-style boxId, so ownership is inferred
    // strictly from the container that was open when they were drawn

  // ---- Local persistence -----------------------------------------------------

  // ---- Copy / paste ---------------------------------------------------------
  let clipboard = null;
  // Collect a box together with its descendant boxes and the grid lines bound to them.
  function collectSubtree(rootId){
    const boxes=[], grids=[];
    const visit=(id)=>{
      const b=findById(state.boxes,id); if(!b)return;
      // bake current effective extent so the clone is positioned correctly even
      // if a binding falls outside the copied subtree
      const e=boxExt(b);
      boxes.push({ ...JSON.parse(JSON.stringify(b)), x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2 });
      state.gridlines.filter(g=>g.boxId===id).forEach(g=>grids.push(JSON.parse(JSON.stringify(g))));
      state.boxes.filter(c=>c.parentId===id).forEach(c=>visit(c.id));
    };
    visit(rootId);
    return { boxes, grids };
  }
  function copyBox(id){ clipboard = collectSubtree(id); }
  function pasteClipboard(at){
    if (!clipboard) return;
    const data = JSON.parse(JSON.stringify(clipboard));
    // offset so the paste lands near the cursor (or +2ft if no point given)
    const root = data.boxes[0];
    const dx = at ? at.x - root.x1 : 2;
    const dy = at ? at.y - root.y1 : 2;
    const idMap = new Map();
    data.boxes.forEach(b=>idMap.set(b.id, uid()));
    data.grids.forEach(g=>idMap.set(g.id, uid()));
    const remap = id => (id!=null && idMap.has(id)) ? idMap.get(id) : null;
    const remapRef = ref => {
      if (!ref) return null;
      if (ref.type==='grid') { const id=remap(ref.id); return id!=null ? {type:'grid',id} : null; }
      if (ref.type==='edge') { const bid=remap(ref.boxId); return bid!=null ? {type:'edge',boxId:bid,edge:ref.edge} : null; }
      return null;
    };
    data.boxes.forEach(b=>{
      b.id=idMap.get(b.id);
      b.parentId=remap(b.parentId);

  // ---- Insert (copy an existing Unit Plan/Layout in via 4 picked grids) -----
  // Like collectSubtree, but also pulls in the walls/elements that belong to
  // the subtree (by containerId, falling back to geometric containment for

  // boxes stay reference-based (fraction of their box) so rescaling them
  // later is just moving the box, no per-grid math needed.
  function collectSubtreeFull(rootId){

    // Ownership is strict (no positional fallback) — an untagged wall/element
    // has no known owner and isn't included, same rule drawLiveThumb uses.
    const owns = containerId => containerId!=null && boxIds.has(containerId);
    const walls = state.walls.filter(wl=>owns(wl.containerId)).map(wl=>{
      const a=endPos(wl.a), b=endPos(wl.b);

  // Begin picking 4 reference edges to place a copy of `id` (a Unit Plan or
  // Layout living anywhere in the document) into the currently open container.
  function startInsert(id){
    state.inserting = { sourceId:id, picks:[] };
    setTool('select');
    buildInsertList();
    draw();
  }
  function tryFinalizeInsert(){
    const vert=state.inserting.picks.filter(p=>p.axis==='h'); // vertical edges → x
    const horz=state.inserting.picks.filter(p=>p.axis==='v'); // horizontal edges → y

  // Clone the source box's subtree, rescaled from its own footprint to fit
  // exactly between the 4 picked references, and drop it into the currently
  // open container — a fresh, independent instance (edits to it never touch
  // the original, or any other instance placed elsewhere).
  function insertSubtreeAt(sourceId, refs){
    const x1=resolveRef(refs.x1), x2=resolveRef(refs.x2), y1=resolveRef(refs.y1), y2=resolveRef(refs.y2);
    if (x1==null||x2==null||y1==null||y2==null) return;
    const tX1=Math.min(x1,x2), tX2=Math.max(x1,x2), tY1=Math.min(y1,y2), tY2=Math.max(y1,y2);
    const tW=tX2-tX1, tH=tY2-tY1;

    const src = collectSubtreeFull(sourceId);
    const data = JSON.parse(JSON.stringify(src));

    const idMap = new Map();

    data.grids.forEach(g=>idMap.set(g.id, uid()));
    const remap = id => (id!=null && idMap.has(id)) ? idMap.get(id) : null;

    data.boxes.forEach(b=>{

    rootBox.parentId = ac ? ac.id : null;
    // the root tracks the 4 picked references, same as a normally-drawn
    // nested boundary bound to its host's grids/edges
    rootBox.bind = { x1:refs.x1, y1:refs.y1, x2:refs.x2, y2:refs.y2 };

    data.walls.forEach(wl=>{
      wl.id=uid();
      wl.a={ x:fx(wl.a.x), y:fy(wl.a.y), xRef:null, yRef:null };
      wl.b={ x:fx(wl.b.x), y:fy(wl.b.y), xRef:null, yRef:null };
      wl.containerId=rootId;
    });
    data.elements.forEach(el=>{
      el.id=uid();
      el.ref={ x:fx(el.ref.x), y:fy(el.ref.y), xRef:null, yRef:null };
      el.containerId=rootId;
    });

    state.boxes.push(...data.boxes);
    state.gridlines.push(...data.grids);
    state.walls.push(...data.walls);
    state.elements.push(...data.elements);
    // snap walls/elements onto the newly-placed grid system where they land cleanly
    data.walls.forEach(wl=>reanchorWall(wl));
    data.elements.forEach(el=>{
      const a=anchorAt(el.ref, 16/ppfNow());
      if (a) { el.ref.x=a.x; el.ref.y=a.y; el.ref.xRef=a.xRef; el.ref.yRef=a.yRef; }
    });
    relabelGrid();
    state.selection={kind:'box', id:rootId};
    refreshTray();
    saveStateToStorage();
    draw();
  }
  // Highlight picked/candidate edges while inserting a copy.
  function drawInserting(){

    const drawRef=(ref,strong)=>{ const v=resolveRef(ref); if(v==null)return; const isV=ref.type==='grid'?(findById(state.gridlines,ref.id)||{}).type==='v':(ref.edge==='x1'||ref.edge==='x2');

  // Insert panel: lists every existing box one level below whatever you
  // currently have open (Unit Plans under an open Product, Layouts under an
  // open Unit Plan) — from anywhere in the document, not just this container

  const insertPanelEl = document.getElementById('insertPanel');
  const insertTitleEl = document.getElementById('insertTitle');
  const insertListEl = document.getElementById('insertList');
  function buildInsertList(){

    insertListEl.innerHTML = '';
    if (!kind) return;
    for (const bx of state.boxes.filter(b=>b.kind===kind)) {
      const item=document.createElement('div');

      const cv2=document.createElement('canvas'); cv2.width=150; cv2.height=150; item.appendChild(cv2);
      const nm=document.createElement('div'); nm.className='nm';

  // ---- Tools / UI -----------------------------------------------------------
  const toolbar=document.getElementById('toolbar');
  toolbar.addEventListener('click', e=>{
    const t=e.target.closest('.tool'); if(!t || !t.dataset.tool)return;

  });
  const trayEl = document.getElementById('tray');
  const toggleLibraryBtn = document.getElementById('toggleLibraryBtn');
  const toggleInsertBtn = document.getElementById('toggleInsertBtn');
  // Library and Insert share one slot — opening one closes the other, and
  // clicking the active one closes it, leaving just the toolbar and canvas.
  function setSidePanel(which){
    trayEl.hidden = which!=='library';
    insertPanelEl.hidden = which!=='insert';
    toggleLibraryBtn.classList.toggle('active', which==='library');
    toggleInsertBtn.classList.toggle('active', which==='insert');
    if (which==='insert') buildInsertList();
  }
  toggleLibraryBtn.addEventListener('click', ()=>setSidePanel(trayEl.hidden ? 'library' : 'none'));
  toggleInsertBtn.addEventListener('click', ()=>setSidePanel(insertPanelEl.hidden ? 'insert' : 'none'));
  function setTool(name){
    // boundary tools are only usable when their kind is the drawable one
    if (['product','unitplan','layout'].includes(name) && name!==drawableBoundaryKind()) return;
    // elements are only placeable while a Layout is open
    if (isElementTool(name) && (activeContainer()||{}).kind!=='layout') return;
    state.tool=name; drag=null; dimBuild=null; hoverList=[]; hoverIdx=0;
    toolbar.querySelectorAll('.tool[data-tool]').forEach(c=>c.classList.toggle('active', c.dataset.tool===name));
    updateCursor();
    updateTip();
    draw();
  }
  // The single boundary kind that can currently be drawn: child of the deepest
  // open boundary, or 'product' if nothing is open (null if a layout is open).
  // The deepest open boundary (the container you're working in), or null.
  function activeContainer(){
    let active=null, bestDepth=-1;
    for (const b of state.boxes) {
      if (!b.open) continue;
      let d=0, p=b.parentId;
      while (p!=null) { d++; const pb=findById(state.boxes,p); p=pb?pb.parentId:null; }
      if (d>bestDepth) { bestDepth=d; active=b; }
    }
    return active;
  }
  function drawableBoundaryKind(){
    const active = activeContainer();
    const child = { product:'unitplan', unitplan:'layout', layout:null };
    return active ? child[active.kind] : 'product';
  }
  // The tray's title tracks whatever boundary you currently have open —
  // "Library" alone when nothing is open.
  const KIND_LABEL = { product:'Product', unitplan:'Unit Plan', layout:'Layout' };
  const libraryTitleEl = document.getElementById('libraryTitle');
  function updateLibraryTitle(){
    const active = activeContainer();
    libraryTitleEl.textContent = active ? `Library: ${KIND_LABEL[active.kind]}` : 'Library';
  }
  // Open a boundary and all its ancestors, so the full nesting chain is active
  // (you then close them from the inside out).
  // Opening/closing a boundary changes which Library section is visible and
  // which item sorts to the top, so both refresh the tray.
  function openWithAncestors(bx){
    bx.open = true;
    let p = bx.parentId;
    while (p != null) { const pb = findById(state.boxes, p); if (!pb) break; pb.open = true; p = pb.parentId; }
    refreshTray();
  }
  function closeBoundary(bx){
    bx.open = false;
    refreshTray();
  }
  // Enable only the drawable boundary tool; grey out the others.
  const elementGroupEl = document.getElementById('elementGroup');
  function updateToolAvailability(){
    const drawable = drawableBoundaryKind();
    for (const kind of ['product','unitplan','layout']) {
      const btn = toolbar.querySelector(`.tool[data-tool="${kind}"]`);
      if (btn) btn.classList.toggle('disabled', kind!==drawable);
    }
    // Elements are furniture/fixtures for a Layout's interior — only usable
    // while a Layout is the open (deepest) container.
    const layoutOpen = (activeContainer()||{}).kind === 'layout';
    elementGroupEl.classList.toggle('disabled', !layoutOpen);
    // if the active tool just became unavailable, fall back to select
    const toolNowInvalid = (['product','unitplan','layout'].includes(state.tool) && state.tool!==drawable)
      || (isElementTool(state.tool) && !layoutOpen);
    if (toolNowInvalid) {
      state.tool='select';
      toolbar.querySelectorAll('.tool[data-tool]').forEach(c=>c.classList.toggle('active', c.dataset.tool==='select'));
      updateCursor(); updateTip();
    }
  }
  function updateCursor(){
    stage.style.cursor = state.tool==='select' ? 'default' : 'crosshair';
  }
  function updateTip(){ /* instructions bubble removed */ }

  document.getElementById('showProductDims').addEventListener('change', e=>{ state.showDims.product=e.target.checked; draw(); });
  document.getElementById('showUnitplanDims').addEventListener('change', e=>{ state.showDims.unitplan=e.target.checked; draw(); });
  document.getElementById('showLayoutDims').addEventListener('change', e=>{ state.showDims.layout=e.target.checked; draw(); });

  // Freeze every wall endpoint at its current resolved position. Call before
  // removing grids/boxes so anchored walls stay put instead of jumping back.
  function bakeAllWallCoords(){
    state.walls.forEach(wl=>{ for(const ep of [wl.a,wl.b]){ const p=endPos(ep); ep.x=p.x; ep.y=p.y; } });
    state.elements.forEach(el=>{ const p=endPos(el.ref); el.ref.x=p.x; el.ref.y=p.y; });
  }
  // Drop bindings/refs pointing at removed features. Wall endpoints revert to a
  // free coord; dimensions drop dead references and are removed if <2 remain.
  function clearRefsTo(boxIds, gridIds){
    const dead = ref => ref && ((ref.type==='grid'&&gridIds.has(ref.id)) || (ref.type==='edge'&&boxIds.has(ref.boxId)));
    state.boxes.forEach(b=>{ if(b.bind) for(const k in b.bind){ if(dead(b.bind[k])) b.bind[k]=null; } });
    state.walls.forEach(wl=>{ for(const ep of [wl.a,wl.b]){ if(dead(ep.xRef)) ep.xRef=null; if(dead(ep.yRef)) ep.yRef=null; } });
    state.elements.forEach(el=>{ if(dead(el.ref.xRef)) el.ref.xRef=null; if(dead(el.ref.yRef)) el.ref.yRef=null; });
    // constrained dims (lock/eq/flex) depend on their exact reference set — drop
    // the whole dim if any reference died; plain dims just lose the dead refs.
    state.dims = state.dims.filter(d => !((d.locked||d.eq||d.flex) && d.refs.some(dead)));
    state.dims.forEach(d=>{ d.refs = d.refs.filter(r=>!dead(r)); });
    state.dims = state.dims.filter(d=>d.refs.length>=2);
  }
  function deleteSelection(){
    const s=state.selection; if(!s)return;
    if(s.kind==='wall')state.walls=state.walls.filter(w=>w.id!==s.id);
    if(s.kind==='element')state.elements=state.elements.filter(el=>el.id!==s.id);
    if(s.kind==='dim')state.dims=state.dims.filter(d=>d.id!==s.id);
    if(s.kind==='grid'){
      bakeAllWallCoords();
      state.gridlines=state.gridlines.filter(g=>g.id!==s.id);
      clearRefsTo(new Set(), new Set([s.id]));
      relabelGrid();
    }
    if(s.kind==='box'){
      // remove the box, its descendant boxes, and the grid lines bound to them
      bakeAllWallCoords();
      const sub = collectSubtree(s.id);
      const boxIds = new Set(sub.boxes.map(b=>b.id));
      const gridIds = new Set(sub.grids.map(g=>g.id));
      state.gridlines = state.gridlines.filter(g=>!gridIds.has(g.id));
      clearRefsTo(boxIds, gridIds); // edges/endpoints bound to removed features go free
      state.boxes = state.boxes.filter(b=>!boxIds.has(b.id));
      relabelGrid();
    }
    refreshTray(); // wall/element/grid/box removal can all change a preview's contents
    saveStateToStorage(); // deletes always persist immediately, so they can't come back on reload
    state.selection=null; draw();
  }

  function fitView(){
    // gather all points
    const pts=[];
    state.walls.forEach(w=>{pts.push(endPos(w.a),endPos(w.b));});
    state.dims.forEach(d=>{ const ep=dimLineEndpoints(d); if(ep)pts.push(ep[0],ep[1]); });
    state.gridlines.forEach(g=>{ const gp=gridPos(g); if(g.type==='v')pts.push({x:gp,y:0}); else pts.push({x:0,y:gp}); });
    state.boxes.forEach(b=>{ const e=boxExt(b); pts.push({x:e.x1,y:e.y1},{x:e.x2,y:e.y2}); });
    state.elements.forEach(el=>{ elementCorners(el).forEach(c=>pts.push(c)); });
    if(pts.length===0){
      state.view={x:cv.clientWidth/2, y:cv.clientHeight/2, scale:1}; draw(); return;
    }
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    pts.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});
    const pad=4;
    minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
    const wW=maxX-minX, wH=maxY-minY;
    const sx=cv.clientWidth/(wW*PPF), sy=cv.clientHeight/(wH*PPF);
    state.view.scale=Math.max(0.15,Math.min(12,Math.min(sx,sy)));
    state.view.x = cv.clientWidth/2 - ((minX+maxX)/2)*ppfNow();
    state.view.y = cv.clientHeight/2 - ((minY+maxY)/2)*ppfNow();
    draw();
  }

  // ---- Keyboard -------------------------------------------------------------
  let spaceDown=false;
  let shiftDown=false;
  window.addEventListener('keydown', e=>{
    if(e.key==='Shift' && !shiftDown){ shiftDown=true; if(state.tool==='grid')draw(); }
    if(e.target.tagName==='INPUT')return;
    // Tab cycles the highlight through overlapping containers (then grids) under
    // the cursor — never moves focus to the toolbar buttons.
    if(e.key==='Tab'){ e.preventDefault(); if(hoverList.length>1){ hoverIdx=(hoverIdx+1)%hoverList.length; draw(); } return; }
    // copy / paste a bounding box (with its grids & child boxes)
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){
      if(state.selection && state.selection.kind==='box'){ copyBox(state.selection.id); }
      return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){
      pasteClipboard(state.snap ? snapWorld(mouseWRaw) : mouseWRaw); e.preventDefault(); return;
    }
    if(e.key==='Enter'){ if(dimBuild) commitDim(); return; }
    if(e.code==='Space'){spaceDown=true; stage.style.cursor='grab'; e.preventDefault(); return;}
    const k=e.key.toLowerCase();
    if(k==='r' && state.selection && state.selection.kind==='element'){
      const el=findById(state.elements,state.selection.id); if(el){ el.rot=((el.rot||0)+90)%360; draw(); } return;
    }
    if(k==='v')setTool('select');
    else if(k==='b')setTool('product');
    else if(k==='u')setTool('unitplan');
    else if(k==='y')setTool('layout');
    else if(k==='n')setTool('element:toilet');
    else if(k==='g')setTool('grid');
    else if(k==='w'||k==='6')setTool('wall6');
    else if(k==='7')setTool('wall12');
    else if(k==='d')setTool('dim');
    else if(k==='l')setTool('lockdim');
    else if(k==='e')setTool('eqdim');
    else if(k==='f')setTool('flexdim');
    else if(e.key==='Delete'||e.key==='Backspace')deleteSelection();
    else if(e.key==='Escape'){drag=null;dimBuild=null;state.inserting=null;state.selection=null;buildInsertList();draw();}
    else if(e.key==='Home')fitView();
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='Space'){spaceDown=false; updateCursor();}
    if(e.key==='Shift'){ shiftDown=false; if(state.tool==='grid')draw(); }
  });

  // ---- Boot -----------------------------------------------------------------
  function seed(){
    state.view={x:80,y:70,scale:1};
    loadStateFromStorage(); // restore whatever was last explicitly saved, if anything
  }
  seed();
  refreshTray();
  resize();
  setTool('select');
  fitView();
})();
</script>
</body>
</html>
